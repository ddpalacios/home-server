<!DOCTYPE html>
<html>
    <head></head>
    <style>

        #visualizer {
           position:absolute;
            border: 1px solid black;
             width: 100%; height: 100%;
        }

body, html { height:100%;  overflow: hidden;}
    </style>
<body>

  <canvas id="visualizer" ></canvas>

</body>
<script>
    let canvas = document.querySelector("#visualizer");
    let ctx = canvas.getContext("2d");
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    var pixel_size = 20
    var numRows =  Math.floor(canvas.height / pixel_size);
    var numCols = Math.floor(canvas.width / pixel_size);
    var big_canvas_grid = []
    var small_canvas_grid = []
    var mag_view_w =20
    var mag_view_h = 10
    var c_view_x = 0
    var c_view_y = 0;
    var big_grid_cords = []
    var map = new Map();


    function countNeighbors(row, col) {
        let count = 0;
        for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            const r = row + i;
            const c = col + j;
            if (r >= 0 && r < numRows && c >= 0 &&
            c < numCols && !(i === 0 && j === 0)) {
            count += big_canvas_grid[r][c];
            }
        }
        }
        return count;
}

    function updateGrid() {
        const newGrid = [];
        for (let i = 0; i < numRows; i++) {
            newGrid[i] = [];
            for (let j = 0; j < numCols; j++) {
                const neighbors = countNeighbors(i, j);
                if (big_canvas_grid[i][j] === 1 && (neighbors < 2 || neighbors > 3)) {
                newGrid[i][j] = 0;
                } else if (big_canvas_grid[i][j] === 0 && neighbors === 3) {
                newGrid[i][j] = 1;
                } else {
                newGrid[i][j] = big_canvas_grid[i][j];
                }
            }
        }
        big_canvas_grid = newGrid;
        return big_canvas_grid
}

    function check(e) {
        var code = e.keyCode;
            if (code == 37){
                console.log("Left");
                c_view_x -=1

            }else if (code == 38){
                console.log("Up");
                c_view_y -=1

            }else if (code == 39){
                console.log("Right");
                c_view_x +=1

            } else if (code == 40){
                console.log("Down");
                c_view_y +=1

            }
}

    function mouseMove(e){
        e.preventDefault();
        cPostX = e.pageX - canvas.offsetLeft;
        cPostY = e.pageY - canvas.offsetTop;
        }
    window.addEventListener('keydown',check,false);
    canvas.addEventListener("mousemove", mouseMove, false);


    function draw_big_grid_lines(){
        if (big_canvas_grid.length ==  0){
            // initial grid
            for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                }
            }
        }else{
            for (let i =0; i<numRows; i++){
                    for (let j =0; j<numCols; j++){
                            var x = j*pixel_size;
                            var y = i * pixel_size;
                            ctx.beginPath();
                            ctx.lineWidth = ".1";
                            ctx.strokeStyle = "green";
                            ctx.rect(x, y, pixel_size, pixel_size);
                            ctx.stroke();
                            ctx.closePath();
                    }
                }
        }
    }

    function draw_small_grid_lines(){
       var sm_x = 0
       var sm_y = 0
        map = new Map();

        if (small_canvas_grid.length ==  0){
            // initial grid
            
            for (let i =0; i<mag_view_h; i++){
                small_canvas_grid[i] = []
                for (let j =0; j<mag_view_w; j++){
                    small_canvas_grid[i][j] = 0;
                }
            }
        }
        for (let i =0; i<numRows; i++){
            for (let j =0; j<numCols; j++){
                if (j == c_view_x && i == c_view_y){
                    var x = j * pixel_size
		            var y = i * pixel_size
                    for (let h=0; h<mag_view_h; h++){
                            for (let w=0; w<mag_view_w; w++){
                                    var new_x = x + (w*pixel_size)
                                    var new_y = y + (h*pixel_size)
                                    ctx.beginPath();
                                    ctx.lineWidth = "1";
                                    ctx.strokeStyle = "black";
                                    ctx.rect(new_x, new_y, pixel_size, pixel_size);
                                    ctx.stroke();
                                    ctx.closePath();
                                    new_x = j + x 
                                    new_y = i + y
                                    var bx = c_view_x+w
                                    var by = c_view_y+h
                                    map.set(w+","+h, bx+","+by)
                            }
                        }
                    }
                }
            }
            // console.log(big_grid_cords)
    }

    function mainLoop(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        draw_big_grid_lines();
        draw_small_grid_lines();

        
        for (let i =0; i<numRows; i++){
            for (let j =0; j<numCols; j++){
                if (i ==50){
                big_canvas_grid[i][j] = 1
            }
        }
    }

      
        big_canvas_grid = updateGrid() 

        for (let i =0; i<numRows; i++){
            for (let j =0; j<numCols; j++){
                var x = j * pixel_size
			    var y = i * pixel_size
                if (big_canvas_grid[i][j] ==1){
                    ctx.fillStyle = "rgba(255,0,0,255)";
			        ctx.fillRect(x, y , pixel_size, pixel_size);
                }
            }
        }
        for (let h=0; h<mag_view_h; h++){
            for (let w=0; w<mag_view_w; w++){
                    if (map.has(w+','+h)){
                        var big_x = map.get(w+','+h).split(",")[0]
                        var big_y = map.get(w+','+h).split(",")[1]
                        if (big_canvas_grid[big_y][big_x] == 1){
                            console.log("Rect at ",w+","+h )
                            console.log("Scaled cords",w*5+","+h*5 )
                            ctx.fillStyle = "rgba(255,0,0,255)";
                            var scale = 5
			                ctx.fillRect((w*pixel_size)*scale, (h*pixel_size)*scale, pixel_size*scale, pixel_size*scale);
                        }
                    }
                }
            }
        requestAnimationFrame(mainLoop);
    }
    mainLoop();

</script>

</html>
