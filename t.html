<style>
.scroll-container {
  width: 100%;
  overflow: hidden;
  background: #111;
  padding: 1rem 0;
}

.scroll-content {
  display: flex;
  width: max-content;
  animation: scroll 20s linear infinite;
}

.scroll-content img {
  margin: 0 1rem;
  border-radius: 10px;
}

/* Keyframes for continuous horizontal scroll */
@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
</style>
