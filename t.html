<!DOCTYPE html>
<html>
    <head></head>
    <style>

        #visualizer {
           position:absolute;
            border: 1px solid black;
             width: 100%; height: 100%;
        }

body, html { height:100%;  overflow: hidden; }
    </style>
<body>

  <canvas id="visualizer" ></canvas>

</body>
<script>
    let canvas = document.querySelector("#visualizer");
    let ctx = canvas.getContext("2d");
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    var pixel_size = 1
    var numRows =  Math.floor(canvas.height / pixel_size);
    var numCols =Math.floor(canvas.width / pixel_size);
    var big_canvas_grid = []
    var rule = 1

    function binaryToInt(binaryStr) {
    let result = 0;
    let length = binaryStr.length;

    for (let  i = 0; i < length; i++) {
        if (binaryStr[i] == '1') {
            result += Math.pow(2, length - 1 - i);
        }
    }
    return result;
}
function reset(){
            big_canvas_grid = []
            for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }
}
function check(e) {
        var code = e.keyCode;
            if (code == 38){
                console.log("Up");
                if (pixel_size-1 <=0 ){
                    return
                }
                pixel_size -=1
                numRows =  Math.floor(canvas.height / pixel_size);
                 numCols =Math.floor(canvas.width / pixel_size);
                for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }

             }
             if (code == 40){
                console.log("Down");
                pixel_size +=1
                numRows =  Math.floor(canvas.height / pixel_size);
                numCols =Math.floor(canvas.width / pixel_size);
                for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }


            }
            if (code == 39){
                console.log("Right");
                rule +=1
                for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }

            }  if (code == 37){
                console.log("Left");
                if (rule-1 <=0){
                    return
                }
                rule -=1
                for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }


            }

        }
    window.addEventListener('keydown',check,false);


    function main(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (big_canvas_grid.length ==  0){
            for (let i =0; i<numRows; i++){
                big_canvas_grid[i] = []
                for (let j =0; j<numCols; j++){
                    big_canvas_grid[i][j] = 0;
                    if (i == 0 && j == Math.floor(numCols*.5)){
                        big_canvas_grid[i][j] = 1
                    }
                }
            }
        }
        for (let i=1; i < numRows; i++){
            for (let j=0; j < numCols; j++){
                    var x = j * pixel_size
			        var y = i * pixel_size
                    let currVal = big_canvas_grid[i][j];
                    let left_neighbor = null;
                    let right_neighbor = null;
                    let top_neighbor = null; 
                    if (j-1 < 0){
                        left_neighbor = 0
                    }else{
                        left_neighbor = big_canvas_grid[i-1][j-1]
                    }
                    if (j+1 < canvas.width){
                        right_neighbor = big_canvas_grid[i-1][j+1]
                    }else{
                        right_neighbor = 0;
                    }
                    top_neighbor = big_canvas_grid[i-1][j]
                    let r = left_neighbor + ""+top_neighbor+""+right_neighbor
                    let result = binaryToInt(r)
                    let is_valid = 0;
                    if (result == 7){
                        is_valid = rule & 0x80
                    }if (result == 6){
                        is_valid = rule & 0x40
                    }if (result == 5){
                        is_valid = rule & 0x20
                    }if (result == 4){
                        is_valid = rule & 0x10
                    }if (result == 3){
                        is_valid = rule & 0x8
                    }if (result == 2){
                        is_valid = rule & 0x4
                    }if (result == 1){
                        is_valid = rule & 0x2
                    }if (result == 0){
                        is_valid = rule & 0x1
                    }
                    if (is_valid){
                        big_canvas_grid[i][j] = 1
                        ctx.fillStyle = 'green'
                        ctx.fillRect(x, y , pixel_size, pixel_size);
                    }
            }
        }

	requestAnimationFrame(main);


    }
    main()



</script>

</html>
