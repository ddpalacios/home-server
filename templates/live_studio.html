<!doctype html>
<title>Live Studio</title>
<style>
  * {
    box-sizing: border-box; 
  }
body, html {  overflow: hidden; }

  body {
    display: flex;
    min-height: 100vh;
    flex-direction: row;
    margin: 0;
  }
  .outer-col-1 {
    background: #e4effd;
    flex: 1;
  }

  .inner-col {
    flex: 6;
    outline: 1px solid black;
  }
    #visualizer {
        position: relative;
        width: 100%; height: 100%;

}
  .create-btn {
  /* position: absolute;
  top: 20px;   
  right: 10px; 
  z-index: 2;  */
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

  .hide-btn {
  border: none;
  border-radius: 6px;
  padding: 4px 6px;
  cursor: pointer;
}
.chat-container {
  display: flex;
  flex-direction: column;
  height: 90vh;
}

.messages {
  flex: 1;       
  scrollbar-width: thin;    
  scroll-behavior: smooth;
  overflow-y: auto;     
  padding: 0.5em;
}

.chat-input {
  display: flex;
  gap: 0.5em;
  padding: 0.5em;
  border-top: 1px solid #ccc;
}

.chat-input input {
  flex: 1;  
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #aaa;
}

.chat-input button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background-color: green;
  color: white;
  cursor: pointer;
}
#send {
            font-size: 1rem;
            background-color: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

    button:hover {
            background-color: #9de1eb;
        }

        button:active {
            transform: scale(0.98);
        }
        
        input:focus {
            border-color: #9de1eb;
        }

 canvas, nav {
    padding: 1em;
  }


</style>
<body>

<nav class="outer-col-1" id="chatbox">

  <div id="chat" class="chat-container">  
    <h1>Live Chat</h1>
    <input id="stop_session" class="create-btn" type="button" style="background-color: lightcoral; display: none;" value="Stop Session"/>
    <input id="home" class="create-btn" type="button" style="margin-top: 10px; background-color: rgb(250, 214, 96); display: none;" value="Back Home"/>
    <input id="create_session" class="create-btn" type="button" style="background-color: lightgreen;" value="+ Create Session"/>
    
    <div id="username-container">
    <input hidden="false" id="username" placeholder="Your name..." onchange="change_username()" style="margin-bottom: 10px; width: 100%;"/>
    <input hidden="false" id="sessionname" placeholder="session name..." onchange="change_sessionname()" style="margin-bottom: 10px; width: 100%;"/>
    </div>
    <div id="messages" class="messages">
    </div>
    
    <div class="chat-input">
      <textarea id="messagebox" rows="5" cols="45" style="width: 100%;" wrap="soft" onkeypress="onTestChange();" placeholder="Type a message here..." ></textarea>
    </div>
      <button style="margin-top: 10px; padding: 10px;" onclick="send_message(null)" id="send">Send</button>
  </div>
</nav>
      <div class="inner-col">
            <button  id="hide_chat" class="hide-btn" type="button" style=" background-color: lightcoral;"   value="Hide Chat">Hide Chat</button>
            <button  id="show_chat" class="hide-btn" type="button" style=" background-color: lightgreen;  display: none;"  value="Show Chat">Show Chat</button>
            <canvas id="visualizer" ></canvas>

      </div>
</body>

    function change_sessionname(){
        if (websocket_session == null){return}
        let new_sessionname = document.getElementById('sessionname').value
        let old_sessionname = sessionStorage.getItem("sessionname");
        let userid = sessionStorage.getItem("userid");
        let username = sessionStorage.getItem("username");
        let sessionId = window.location.hash.split("session=")[1]

        var request = new Request('/life-of-sounds/live_studio/session', {
                            method: 'PATCH',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify({
                                "sessionId":sessionId
                                ,"name":new_sessionname
                            })
                    });
        fetch(request)
        .then((response) => {
            if (response.status == 200){ 
                let message =  "**<b>"+username+"</b> changed the session name to <b>"+ new_sessionname+"</b>"
                websocket_session.send(JSON.stringify({
                      "operation": "session"
                        ,"request" : "PATCH"
                        ,'name': new_sessionname
                        ,'sessionId': sessionid
                }))
                update_client_session(userid, username,new_sessionname)
                sessionStorage.setItem("sessionname", new_sessionname);
                send_message(message)
            }else{
                alert("Error Changing Username")
            }
        })
        
    }

    function change_username(){
        if (websocket_session == null){return}
        let new_username = document.getElementById('username').value
        let old_username = sessionStorage.getItem("username");
        let userid = sessionStorage.getItem("userid");
        let sessionname = sessionStorage.getItem("sessionname");

        var request = new Request('/life-of-sounds/live_studio/client', {
                            method: 'PATCH',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify({
                                "userId":userid
                                ,"username":new_username
                            })
                    });
        fetch(request)
        .then((response) => {
            console.log("response.status =", response.status); // response.status = 200
            if (response.status == 200){ 
                let message =  "**<b>"+old_username+"</b> has changed its name to: <b>"+ new_username+"</b>"
                update_client_session(userid, new_username, sessionname)
                sessionStorage.setItem("username", new_username);
                send_message(message)
            }else{
                alert("Error Changing Username")
            }
        })
        
    }
    
    function removeElement(id) {
        var elem = document.getElementById(id);
        return elem.parentNode.removeChild(elem);
    }
	
    function generate() {
		return nameList[Math.floor( Math.random() * nameList.length )] + " " + nameList[Math.floor( Math.random() * nameList.length )];
	};

    function send_message(message){
        if (websocket_session == null){return;}
        let username = sessionStorage.getItem("username");
        let userid = sessionStorage.getItem("userid");
        let sessionid = sessionStorage.getItem("sessionid");
        let text = null;
        let is_notification = 0;
        if (message == null || message == undefined){
            text = document.getElementById("messagebox").value
            let p = document.createElement('p');
            p.innerHTML  = "<b>"+username+ ":</b> "+text;
            let chat = document.getElementById('messages')
            chat.appendChild(p);
        }else{
            text = message
            let p = document.createElement('p');
            p.innerHTML  = text;
            let chat = document.getElementById('messages')
            chat.appendChild(p);
            is_notification = 1
        }
        websocket_session.send(JSON.stringify({
            "operation": "message"
            ,"request" : "POST"
            ,'username': username
            ,'userid':userid
            ,'timestamp': new Date().toISOString()
            ,'sessionId': sessionid
            ,"content": text
            ,"is_notification": is_notification
        }))
        chat.scrollTop = chat.scrollHeight;
        document.getElementById("messagebox").value = ''
    }

    function load_messages(sessionid){
        let data_request = new Request('/life-of-sounds/live_studio/session/messages?sessionId='+sessionid, {
                    method: 'GET'
                    ,headers: new Headers({
                        'Accept': 'application/json'
                        })
                });
        fetch(data_request)
            .then((response)=> response.json())
            .then((data)=> {
                let messages = data['values'];
                messages.forEach(element => {
                    console.log(element['username'],element['content'])
                    let username = element['username'];
                    let text = element['content']
                    let is_notification = element['is_notification']
                    let p = document.createElement('p');
                    if (is_notification){
                         p.innerHTML  = text;
                    }else{
                         p.innerHTML  = "<b>"+username+ ":</b> "+text;
                    }
                    let chat = document.getElementById('messages')
                    chat.appendChild(p);
                });
                let chat = document.getElementById('messages')
                chat.scrollTop = chat.scrollHeight;
            });

    }

    function windowResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        // reset transform so scale doesn’t accumulate
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
}

    function hide_activated_session(){
        document.getElementById("stop_session").style.display = "none";
        document.getElementById("username").hidden = true;
        document.getElementById("sessionname").hidden = true;

        document.getElementById("create_session").style.display = "inline-block";
        let chat = document.getElementById('messages');
        chat.innerHTML = "";
        removeElement('myInput')
        removeElement('invitation_title')
        removeElement('cpy_btn')
        removeElement('spantext1')
        removeElement('spantext2')
    }

    function display_activated_session(sessionid, username){
        document.getElementById("create_session").style.display = "none";
         let sessionname = sessionStorage.getItem("sessionname");
         document.getElementById("username").hidden = false
         document.getElementById("sessionname").hidden = false
         document.getElementById("sessionname").value = sessionname
        document.getElementById("username").value = username
        document.getElementById("stop_session").style.display = "inline-block";
        document.getElementById("home").style.display = "inline-block";

        const container = document.getElementById('username-container');
        const label = document.createElement('span'); 
        label.id = 'spantext2'
        label.textContent = "Username: ";
        label.setAttribute('for', 'username'); 
        label.style.display = 'block'; 
        label.style.marginBottom = '5px';
        label.style.marginTop = '15px';


        const slable = document.createElement('span'); 
        slable.id = 'spantext1'
        slable.textContent = "Session: ";
        slable.setAttribute('for', 'sessionanme'); 
        slable.style.display = 'block'; 
        slable.style.marginBottom = '5px';


        const username_input = document.getElementById('username');
        const sessionname_input = document.getElementById('sessionname');
        container.insertBefore(label, username_input);
        container.insertBefore(slable, sessionname_input);


        let message = "Invitation Link:"
        let p = document.createElement('h1');
        p.id = "invitation_title"
        p.textContent = message;
        let chat = document.getElementById('chat')
        chat.appendChild(p);

        let input = document.createElement('textarea');
        input.id = "myInput"
        input.rows = 5
        input.cols = 10
        input.wrap = "soft"
        let cpy_btn = document.createElement('button');
        cpy_btn.id = 'cpy_btn'
        cpy_btn.style.marginTop = "10px"
        cpy_btn.textContent = "Copy URL"
        cpy_btn.className = "create-btn"
        cpy_btn.onclick = function () {
            var copyText = document.getElementById("myInput");
                copyText.select();
                copyText.setSelectionRange(0, 99999); // For mobile devices
                navigator.clipboard.writeText(copyText.value);
                cpy_btn.textContent = "Copied!"
            }
        input.value = 'https://' + window.location.host  +'/life-of-sounds/live_studio/session/join?Id='+sessionid 
        input.disabled= true;
        chat = document.getElementById('chat')
        chat.appendChild(input);
        chat.appendChild(cpy_btn);

    }

    function start_websocket(sessionid, userid,username){
        if (websocket_session != null){return;}
            websocket_session = new WebSocket('wss://' + window.location.host  +'/life-of-sounds/live_studio/session?Id='+sessionid);
            websocket_session.onopen = () => {
                    console.log("Websocket connection established");                    
                    websocket_session.send(JSON.stringify({
                        'operation': "client"
                        ,"request" : "POST"
                        ,'sessionId': sessionid
                        ,'userid': userid
                        ,'name': username
                        ,'isHost': 1
                    }))                
                    display_activated_session(sessionid, username);
            }
        websocket_session.onmessage = (event) => {
            console.log("Message from server", event.data);
            let data = JSON.parse(event.data)
            if (data['operation'] == 'message'){
                let username = data['username'];
                let text = data['content']
                let p = document.createElement('p');
                let is_notification= data['is_notification']
                if (is_notification){
                    p.innerHTML  = text;
                }else{
                    p.innerHTML  = "<b>"+username+ ":</b> "+text;
                }
                let chat = document.getElementById('messages')
                chat.appendChild(p);
            }else if (data['request'] == 'PATCH' && data['operation'] == 'session'){
                let name = data['name'];
                document.getElementById("sessionname").value = name
            
            }else if (data['request'] == 'DELETE' && data['operation'] == 'client'){
                let username = data['name'];
                let userid = data['userid'];
                setTimeout(() => {
                    var request = new Request('life-of-sounds/live_studio/client?userId='+userid+"&sessionId="+sessionid, {
                    method: 'GET',
                    headers: new Headers({
                                'Accept': 'application/json'
                            })
                        });
                    fetch(request).then(async(response) => {
                        if (!response.ok) {
                            let text = "<b>"+username+"</b> has left the chat.";
                            send_message(text)
                        }
                    }).catch(e => console.error('EXCEPTION: ', e))
                }, 2000);
            }
            else if (data['request'] == 'POST' && data['operation'] == 'client'){
                let username = data['name'];
                let new_login = data['new_login'];
                if (new_login){
                    let text = "<b>"+username+"</b> has joined the chat.";
                    send_message(text)
                }
            }
        }
        websocket_session.onclose = () => {
		    alert("Websocket connection closed");
            location.href = 'https://' + window.location.host  +'/life-of-sounds/live_studio'
        }
    }

    function create_session(data,username){
         var request = new Request('/life-of-sounds/live_studio/session', {
                            method: 'POST',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify(data)
                    });
                fetch(request)
                        .then((response)=> response.json())
                        .then((data)=> {
                            if (data.hasOwnProperty("sessionId")){
                                location.hash = "session=" + data['sessionId'];
                                let sessionid =  data['sessionId'];
                                let userid = data['userid']
                                let sessionname = data['name']
                                sessionStorage.setItem("userid",userid);
                                sessionStorage.setItem("username",username);
                                sessionStorage.setItem("sessionid",sessionid);
                                sessionStorage.setItem("sessionname",sessionname);
                                start_websocket(sessionid, userid,username);
                            }
                        });


    }
  
    function get_session(sessionId, username){
		var request = new Request('life-of-sounds/live_studio/session?Id='+sessionId, {
							method: 'GET',
							headers: new Headers({
										'Accept': 'application/json'
									})
				});
		
		fetch(request)
			.then((response)=> response.json())
			.then((data)=> {
			    console.log("SESSION",data)
                let sessionid =  data['sessionid'];
                let userid = data['userid']
                let sessionname = data['name']
                sessionStorage.setItem("userid",userid);
                sessionStorage.setItem("sessionid",sessionid);
                sessionStorage.setItem("username",username);
                sessionStorage.setItem("sessionname",sessionname);
                load_messages(sessionid);
                start_websocket(sessionid, userid, username);
			})
    }

                            ,body: JSON.stringify({

                    });
            fetch(request).then((response) => {
            console.log("response.status =", response.status); // response.status = 200
            if (response.status == 200){ 
                console.log("COOKIE", document.cookie)
              
            }else{
            }
        })

    }

    function create_client_session(sessionid, sessionname){
            let username = prompt("Your Name:", generate());
            var request = new Request('/life-of-sounds/live_studio/client_session', {
                            method: 'POST',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify({
                                'login_time': new Date().toISOString()
                                ,'username': username
                                ,'sessionname': sessionname
                            })
                    });
            fetch(request).then(function(result) {
                var userid = document.cookie.split(';')[0].split("clientId=")[1]
                console.log("COOKIE", document.cookie)
                sessionStorage.setItem("username", username);
                sessionStorage.setItem("userid", userid);

                load_messages(sessionid);
                start_websocket(sessionid,userid, username);
            });

    }

    document.getElementById("show_chat").onclick = function () {
    sessionActive = true;
    document.getElementById("show_chat").style.display = "none";
    document.getElementById("hide_chat").style.display = "inline-block";
    document.getElementById("chatbox").hidden = false;
    windowResize()
    
        
    }
    
    document.getElementById("hide_chat").onclick = function () {
        sessionActive = false;
        document.getElementById("hide_chat").style.display = "none";
        document.getElementById("show_chat").style.display = "inline-block";
        document.getElementById("chatbox").hidden = true;
        windowResize()

    }

    document.getElementById("create_session").onclick = function () {
            let username = prompt("Your Name:", generate());
            let sessionName = prompt("Session Name:", "The "+generate()+ " Session");
            var request = new Request('/life-of-sounds/live_studio/client_session', {
                            method: 'POST',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify({
                                'login_time': new Date().toISOString()
                                ,'username': username
                                ,'sessionname': sessionName
                            })
                    });
            fetch(request).then(function(result) {
                console.log(document.cookie)
                var userid = document.cookie.split(';')[0].split("clientId=")[1]
                var username = document.cookie.split(';')[1].split("username=")[1]
                console.log(userid, username)
                let data = {
                        'name': sessionName
                        ,'userid': userid
                        ,'username':username
                    }
                console.log(data)
                create_session(data,username)
            });
    }

    document.getElementById("stop_session").onclick = function () {
        hide_activated_session()
        let sessionId = sessionStorage.getItem("sessionid");
         websocket_session.send(JSON.stringify({
                    'operation': "session"
                    ,"request" : "DELETE"
                    ,'sessionId': sessionId
                }))
        var request = new Request('life-of-sounds/live_studio/session?Id='+sessionId, {
                    method: 'DELETE',
                    headers: new Headers({
                                'Accept': 'application/json'
                            })
        });
		fetch(request)
        websocket_session.close()
        location.href = "home"
    }

    document.getElementById("home").onclick = function(){
        location.href = "home"
        
    }

    window.addEventListener("load", function() {
        if (window.location.hash){
            let sessionid = window.location.hash.split("session=")[1]
            if (document.cookie == ""){
                var request = new Request('life-of-sounds/live_studio/session?Id='+sessionid, {
                                            method: 'GET',
                                            headers: new Headers({
                                                        'Accept': 'application/json'
                                                    })
                                });
                        
                        fetch(request)
                            .then((response)=> response.json())
                            .then((data)=> {
                                let sessionname = data['name']
                                sessionStorage.setItem("sessionname",sessionname);
                                sessionStorage.setItem("sessionid",sessionid);
                                create_client_session(sessionid, sessionname)
                            })

            }else{
                var userid = document.cookie.split(';')[0].split("clientId=")[1]
                var username = document.cookie.split(';')[2].split("username=")[1]
                if (username == undefined || username == null){
                    username = document.cookie.split(';')[1].split("username=")[1]
                }
                get_session(sessionid, username);
            }
        }
    });
    
    window.addEventListener('resize', windowResize);

</script>

function countNeighbors(row, col) {
        let count = 0;
        for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            const r = row + i;
            const c = col + j;
            if (r >= 0 && r < numRows && c >= 0 &&
            c < numCols && !(i === 0 && j === 0)) {
            count += big_canvas_grid[r][c];
            }
        }
        }
        return count;
}
function updateGrid() {
        var newGrid = [];
        for (let i = 0; i < numRows; i++) {
            newGrid[i] = [];
            for (let j = 0; j < numCols; j++) {
                const neighbors = countNeighbors(i, j);
                if ((big_canvas_grid[i][j] === 1) && (neighbors < 2 || neighbors > 3)) {
                newGrid[i][j] = 0;
                } else if (big_canvas_grid[i][j] === 0 && neighbors === 3) {
                newGrid[i][j] = 1;
                } else {
                newGrid[i][j] = big_canvas_grid[i][j];
                }
            }
        }
        big_canvas_grid = newGrid;

        return big_canvas_grid
}
