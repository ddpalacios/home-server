<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Line Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <canvas id="areaLineChart" width="400" height="200"></canvas>
  <script>
    const ctx = document.getElementById('areaLineChart').getContext('2d');
    const areaLineChart = new Chart(ctx, {
      type: 'line', // Line chart type
      data: {
        labels: ['January', 'February', 'March', 'April', 'May', 'June'], // X-axis labels
        datasets: [{
          label: 'Sales Data',
          data: [30, 50, 40, 60, 70, 90], // Y-axis data
          borderColor: 'rgba(75, 192, 192, 1)', // Line color
          backgroundColor: 'rgba(75, 192, 192, 0.2)', // Fill color for the area
          borderWidth: 2,
          fill: true // Enables the area fill
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true,
            position: 'top'
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Months'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Sales'
            },
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
