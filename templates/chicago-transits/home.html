<!doctype html>
<title>Chicago Transits</title>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="/life-of-sounds/chatbox_style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>
<style>
    html, body {
    height: 100%; 
    margin: 0;
    padding: 0;
}
#map {
    height: 100vh;   
    width: 100%;    
    margin-top: 0;  
    z-index: 4;     
}
</style>
<style>
* {
  box-sizing: border-box;
}

#myInput {
  background-image: url('/css/searchicon.png');
  background-position: 10px 12px;
  background-repeat: no-repeat;
  width: 100%;
  font-size: 16px;
  padding: 12px 20px 12px 40px;
  border:  rgba(2, 33, 73, 0.444);
  margin-bottom: 12px;
}

#myUL {
  list-style-type: none;
  padding: 0;
  margin: 0;
}

#myUL li a {
  border: 1px solid black;
  margin-top: -1px; /* Prevent double borders */
  background-color: #f6f6f6cc;
  padding: 12px;
  text-decoration: none;
  font-size: 18px;
  color: black;
  display: block
}

#myUL li a:hover:not(.header) {
  background-color: #eee;
}


</style>
<body>
    <div id="canvas_container">
    <div id="content">
        <div id="chatbox">
                <input style="margin-top: 15px;" type="text" id="myInput" onkeyup="myFunction()" placeholder="Search for all stops..." >
                <div id="searchlist" style="max-height: 850px; scrollbar-width:thin; scroll-behavior: smooth; overflow-y: auto; overflow-x: hidden;">
                    <ul id="myUL">
                    </ul>
                </div>
        </div>
    </div>
     <div id="map"></div>
</div>

</body>
<script>


function myFunction() {
    var input, filter, ul, li, a, i, txtValue;
    input = document.getElementById("myInput");
    filter = input.value.toUpperCase();
    ul = document.getElementById("myUL");
    li = ul.getElementsByTagName("li");
    for (i = 0; i < li.length; i++) {
        a = li[i].getElementsByTagName("a")[0];
        txtValue = a.textContent || a.innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
            li[i].style.display = "";
        } else {
            li[i].style.display = "none";
        }
    }
}

</script>

<script>
    var map = L.map('map', {zoomControl: false}).setView([41.881832, -87.623177], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 22,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
var markerGroup = L.layerGroup();
var pLineGroup = L.layerGroup()
var liveTrainMarkerGroup = L.layerGroup();
var markergroups = []
  var stopMarkerGroup = L.layerGroup();
  var selectedMarkerGroup = L.layerGroup();
  markergroups.push(stopMarkerGroup)
  markergroups.push(selectedMarkerGroup)
  markergroups.push(liveTrainMarkerGroup)

var live_interval_id = null;
</script>
<script src="/chicago-transits/websocket.js"></script>
<script src="/chicago-transits/onload_session.js"></script>
