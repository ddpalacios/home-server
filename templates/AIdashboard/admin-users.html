<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Settings — Allowed Users</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 20px;
      --danger: #b91c1c;
      --success: #047857;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #f2f5fb 100%);
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 1100px; margin: 32px auto; padding: 0 22px 80px; }
    .card {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    form.add-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    form.add-row input[type="email"] {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px;
    }
    form.add-row button {
      padding: 10px 16px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
    }
    form.add-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback { font-size: 13px; min-height: 18px; margin-bottom: 10px; }
    .feedback.error { color: var(--danger); }
    .feedback.ok { color: var(--success); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 12px 14px;
      border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .pill.yes { background: #dcfce7; color: #047857; }
    .pill.no  { background: #f3f4f6; color: #6b7280; }
    button.remove {
      background: transparent; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--danger); font-weight: 600;
    }
    button.remove:disabled { opacity: 0.4; cursor: not-allowed; color: var(--muted); }
    .empty { color: var(--muted); padding: 16px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Allowed Users</h1>
      <p class="sub">Anyone listed here can sign in via Google SSO. Add an email to invite, remove to revoke.</p>

      <form class="add-row" id="addForm" autocomplete="off">
        <input type="email" id="emailInput" placeholder="user@example.com" required />
        <button type="submit" id="addBtn">Add</button>
      </form>
      <div class="feedback" id="feedback"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>First name</th>
              <th>Logged in?</th>
              <th>Added on</th>
              <th>Added by</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const $rows = document.getElementById("rows");
    const $form = document.getElementById("addForm");
    const $input = document.getElementById("emailInput");
    const $addBtn = document.getElementById("addBtn");
    const $feedback = document.getElementById("feedback");

    function setFeedback(text, kind) {
      $feedback.textContent = text || "";
      $feedback.className = "feedback" + (kind ? " " + kind : "");
    }

    function fmtDate(epochSeconds) {
      if (!epochSeconds) return "—";
      const d = new Date(epochSeconds * 1000);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderRow(u) {
      const tr = document.createElement("tr");
      tr.dataset.email = u.email;
      const removeAttrs = u.is_self
        ? `disabled title="You cannot remove your own admin email"`
        : "";
      tr.innerHTML = `
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.first_name)}</td>
        <td><span class="pill ${u.has_logged_in ? "yes" : "no"}">${u.has_logged_in ? "Yes" : "No"}</span></td>
        <td>${fmtDate(u.added_at)}</td>
        <td>${escapeHtml(u.added_by)}</td>
        <td><button type="button" class="remove" ${removeAttrs}>Remove</button></td>
      `;
      const btn = tr.querySelector("button.remove");
      if (btn && !u.is_self) {
        btn.addEventListener("click", () => removeUser(u.email));
      }
      return tr;
    }

    function renderEmpty() {
      $rows.innerHTML = `<tr><td colspan="6" class="empty">No users yet. Add one above.</td></tr>`;
    }

    async function loadUsers() {
      setFeedback("");
      try {
        const res = await fetch("/admin/users/list", { credentials: "same-origin" });
        if (!res.ok) {
          setFeedback("Could not load users (HTTP " + res.status + ").", "error");
          return;
        }
        const body = await res.json();
        $rows.innerHTML = "";
        if (!body.users || body.users.length === 0) {
          renderEmpty();
          return;
        }
        body.users.forEach((u) => $rows.appendChild(renderRow(u)));
      } catch (err) {
        setFeedback("Network error loading users.", "error");
      }
    }

    async function addUser(email) {
      $addBtn.disabled = true;
      setFeedback("");
      try {
        const res = await fetch("/admin/users/add", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        if (!res.ok) {
          const codeMessages = {
            invalid_email: "That doesn't look like a valid email.",
            duplicate: "That email is already on the list.",
            unauthenticated: "Your session expired. Refresh and log in.",
            forbidden: "You don't have permission to do that.",
            storage_error: "Couldn't save right now. Try again.",
          };
          setFeedback(codeMessages[body.error] || "Add failed: " + (body.error || res.status), "error");
          return;
        }
        $input.value = "";
        $rows.prepend(renderRow(body));
        const emptyRow = $rows.querySelector(".empty");
        if (emptyRow) emptyRow.parentElement.remove();
        setFeedback("Added " + body.email + ".", "ok");
      } catch (err) {
        setFeedback("Network error adding user.", "error");
      } finally {
        $addBtn.disabled = false;
      }
    }

    async function removeUser(email) {
      if (!confirm("Remove " + email + "? They'll lose access immediately.")) return;
      setFeedback("");
      try {
        const res = await fetch("/admin/users/remove", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        if (!res.ok) {
          const codeMessages = {
            cannot_remove_self: "You can't remove your own admin email.",
            not_found: "That email isn't on the list anymore.",
            forbidden: "You don't have permission to do that.",
            storage_error: "Couldn't save right now. Try again.",
          };
          setFeedback(codeMessages[body.error] || "Remove failed: " + (body.error || res.status), "error");
          return;
        }
        const row = $rows.querySelector(`tr[data-email="${CSS.escape(email)}"]`);
        if (row) row.remove();
        if (!$rows.querySelector("tr")) renderEmpty();
        setFeedback("Removed " + email + ".", "ok");
      } catch (err) {
        setFeedback("Network error removing user.", "error");
      }
    }

    $form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = ($input.value || "").trim();
      if (!email) return;
      addUser(email);
    });

    loadUsers();
  </script>
</body>
</html>
