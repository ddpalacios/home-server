<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Settings — Allowed Users</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 20px;
      --danger: #b91c1c;
      --success: #047857;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #f2f5fb 100%);
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 1100px; margin: 32px auto; padding: 0 22px 80px; }
    .card {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    form.add-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    form.add-row input[type="email"] {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px;
    }
    form.add-row button {
      padding: 10px 16px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
    }
    form.add-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback { font-size: 13px; min-height: 18px; margin-bottom: 10px; }
    .feedback.error { color: var(--danger); }
    .feedback.ok { color: var(--success); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 12px 14px;
      border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .pill.yes { background: #dcfce7; color: #047857; }
    .pill.no  { background: #f3f4f6; color: #6b7280; }
    button.remove {
      background: transparent; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--danger); font-weight: 600;
    }
    button.remove:disabled { opacity: 0.4; cursor: not-allowed; color: var(--muted); }
    button.resend {
      background: transparent; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--accent); font-weight: 600; margin-right: 6px;
    }
    button.resend:disabled { opacity: 0.4; cursor: not-allowed; }
    .empty { color: var(--muted); padding: 16px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Allowed Users</h1>
      <p class="sub">Anyone listed here can sign in via Google SSO. Add an email to invite, remove to revoke.</p>

      <form class="add-row" id="addForm" autocomplete="off">
        <input type="email" id="emailInput" placeholder="user@example.com" required />
        <button type="submit" id="addBtn">Add</button>
      </form>
      <div class="feedback" id="feedback"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>First name</th>
              <th>Logged in?</th>
              <th>Added on</th>
              <th>Invited</th>
              <th>Phone</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const $rows = document.getElementById("rows");
    const $form = document.getElementById("addForm");
    const $input = document.getElementById("emailInput");
    const $addBtn = document.getElementById("addBtn");
    const $feedback = document.getElementById("feedback");

    function setFeedback(text, kind) {
      $feedback.textContent = text || "";
      $feedback.className = "feedback" + (kind ? " " + kind : "");
    }

    function fmtDate(epochSeconds) {
      if (!epochSeconds) return "—";
      const d = new Date(epochSeconds * 1000);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let allPhones = [];

    async function fetchAllPhones() {
      try {
        const res = await fetch("/admin/phones?format=json&scope=all", { credentials: "same-origin" });
        if (!res.ok) return;
        const data = await res.json();
        allPhones = data.phones || [];
      } catch (e) { /* silent */ }
    }

    function phoneForCustomer(customer_id) {
      if (!customer_id) return null;
      return allPhones.find((p) => (p.assigned_account_id || "") === customer_id) || null;
    }

    function unassignedPhones() {
      return allPhones.filter((p) => !p.assigned_account_id);
    }

    function renderPhoneCell(u) {
      const bound = phoneForCustomer(u.customer_id);
      if (bound) {
        return `<span title="${escapeHtml(bound.phone_number || "")}">${escapeHtml(bound.phone_display || bound.phone_number || "—")}</span>`;
      }
      if (!u.website_url) {
        return `<span style="color:var(--muted); font-size:12px;">No phone — user must onboard first</span>`;
      }
      const opts = unassignedPhones();
      if (!opts.length) {
        return `<span style="color:var(--muted); font-size:12px;">No unassigned phones</span>`;
      }
      const optionsHtml = ['<option value="">Choose a phone…</option>']
        .concat(opts.map((p) => `<option value="${escapeHtml(p.phone_id)}">${escapeHtml(p.phone_display || p.phone_number || p.phone_id)}</option>`))
        .join("");
      return `
        <select class="bind-phone-select" style="font-size:13px;">${optionsHtml}</select>
        <button type="button" class="bind-phone-btn">Bind</button>
      `;
    }

    function renderRow(u) {
      const tr = document.createElement("tr");
      tr.dataset.email = u.email;
      tr.dataset.customerId = u.customer_id || "";
      tr.dataset.websiteUrl = u.website_url || "";
      const removeAttrs = u.is_self
        ? `disabled title="You cannot remove your own admin email"`
        : "";
      const invitedLabel = u.last_invite_at ? fmtDate(u.last_invite_at) : "—";
      tr.innerHTML = `
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.first_name)}</td>
        <td><span class="pill ${u.has_logged_in ? "yes" : "no"}">${u.has_logged_in ? "Yes" : "No"}</span></td>
        <td>${fmtDate(u.added_at)}</td>
        <td>${invitedLabel}</td>
        <td>${renderPhoneCell(u)}</td>
        <td>
          <button type="button" class="resend">Resend invite</button>
          <button type="button" class="remove" ${removeAttrs}>Remove</button>
        </td>
      `;
      const removeBtn = tr.querySelector("button.remove");
      if (removeBtn && !u.is_self) {
        removeBtn.addEventListener("click", () => removeUser(u.email));
      }
      const resendBtn = tr.querySelector("button.resend");
      if (resendBtn) {
        resendBtn.addEventListener("click", () => resendInvite(u.email, tr));
      }
      const bindBtn = tr.querySelector("button.bind-phone-btn");
      if (bindBtn) {
        bindBtn.addEventListener("click", () => bindPhone(u, tr));
      }
      return tr;
    }

    async function bindPhone(u, rowEl) {
      setFeedback("");
      const select = rowEl.querySelector("select.bind-phone-select");
      const btn = rowEl.querySelector("button.bind-phone-btn");
      if (!select || !select.value) {
        setFeedback("Pick a phone first.", "error");
        return;
      }
      const phoneId = select.value;
      btn.disabled = true;
      try {
        const res = await fetch(`/admin/phones/${encodeURIComponent(phoneId)}/assign`, {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ website_url: u.website_url, bind_to_email: u.email }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok && res.status !== 202) {
          const msgs = {
            unknown_user: "That email isn't on the allowlist.",
            forbidden: "You don't have permission.",
          };
          setFeedback(msgs[body.error] || ("Bind failed: " + (body.error || res.status)), "error");
          btn.disabled = false;
          return;
        }
        setFeedback(`Bound ${u.email} to a phone — build started.`, "ok");
        // Refresh phones + table.
        await fetchAllPhones();
        await loadUsers();
      } catch (err) {
        setFeedback("Network error binding phone.", "error");
        btn.disabled = false;
      }
    }

    function renderEmpty() {
      $rows.innerHTML = `<tr><td colspan="7" class="empty">No users yet. Add one above.</td></tr>`;
    }

    async function loadUsers() {
      setFeedback("");
      // Refresh phones map first so the Phone column renders correctly.
      await fetchAllPhones();
      try {
        const res = await fetch("/admin/users/list", { credentials: "same-origin" });
        if (!res.ok) {
          setFeedback("Could not load users (HTTP " + res.status + ").", "error");
          return;
        }
        const body = await res.json();
        $rows.innerHTML = "";
        if (!body.users || body.users.length === 0) {
          renderEmpty();
          return;
        }
        body.users.forEach((u) => $rows.appendChild(renderRow(u)));
      } catch (err) {
        setFeedback("Network error loading users.", "error");
      }
    }

    async function addUser(email) {
      $addBtn.disabled = true;
      setFeedback("");
      try {
        const res = await fetch("/admin/users/add", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        if (!res.ok) {
          const codeMessages = {
            invalid_email: "That doesn't look like a valid email.",
            duplicate: "That email is already on the list.",
            unauthenticated: "Your session expired. Refresh and log in.",
            forbidden: "You don't have permission to do that.",
            storage_error: "Couldn't save right now. Try again.",
          };
          setFeedback(codeMessages[body.error] || "Add failed: " + (body.error || res.status), "error");
          return;
        }
        $input.value = "";
        $rows.prepend(renderRow(body));
        const emptyRow = $rows.querySelector(".empty");
        if (emptyRow) emptyRow.parentElement.remove();
        if (body.invite_status === "sent") {
          setFeedback("Added " + body.email + " — invite sent.", "ok");
        } else if (body.invite_status === "failed") {
          setFeedback("Added " + body.email + " — invite failed. Click \"Resend invite\" to try again.", "error");
        } else {
          setFeedback("Added " + body.email + ".", "ok");
        }
      } catch (err) {
        setFeedback("Network error adding user.", "error");
      } finally {
        $addBtn.disabled = false;
      }
    }

    async function resendInvite(email, rowEl) {
      setFeedback("");
      const btn = rowEl ? rowEl.querySelector("button.resend") : null;
      if (btn) btn.disabled = true;
      try {
        const res = await fetch("/admin/users/invite", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        if (!res.ok || body.sent === false) {
          const codeMessages = {
            not_found: "That email isn't on the list anymore.",
            invalid_email: "That email looks invalid.",
            forbidden: "You don't have permission to do that.",
            send_failed: "Couldn't send the invite. Try again later.",
          };
          setFeedback(codeMessages[body.error] || "Resend failed: " + (body.error || res.status), "error");
          return;
        }
        if (rowEl) {
          const cell = rowEl.querySelector("td:nth-child(6)");
          if (cell) cell.textContent = fmtDate(Math.floor(Date.now() / 1000));
        }
        setFeedback("Invite resent to " + email + ".", "ok");
      } catch (err) {
        setFeedback("Network error resending invite.", "error");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function removeUser(email) {
      if (!confirm("Remove " + email + "? They'll lose access immediately.")) return;
      setFeedback("");
      try {
        const res = await fetch("/admin/users/remove", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        if (!res.ok) {
          const codeMessages = {
            cannot_remove_self: "You can't remove your own admin email.",
            not_found: "That email isn't on the list anymore.",
            forbidden: "You don't have permission to do that.",
            storage_error: "Couldn't save right now. Try again.",
          };
          setFeedback(codeMessages[body.error] || "Remove failed: " + (body.error || res.status), "error");
          return;
        }
        const row = $rows.querySelector(`tr[data-email="${CSS.escape(email)}"]`);
        if (row) row.remove();
        if (!$rows.querySelector("tr")) renderEmpty();
        setFeedback("Removed " + email + ".", "ok");
      } catch (err) {
        setFeedback("Network error removing user.", "error");
      }
    }

    $form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = ($input.value || "").trim();
      if (!email) return;
      addUser(email);
    });

    loadUsers();
  </script>
</body>
</html>
