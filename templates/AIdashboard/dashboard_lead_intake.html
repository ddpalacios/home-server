<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead intake</title>
<style>
  :root {
    --fg:#0a0a0a; --sub:#5a6470; --bg:#fff; --card:#fff;
    --line:#e6e9ef; --accent:#185fa5; --err:#c0392b; --ok:#0a8a3a;
    --soft:#f0f4f9;
  }
  * { box-sizing:border-box; }
  /* Body background matches the parent dashboard so the iframe
     reads as part of the page, not a card embedded on it. The iframe
     itself is sized to the route section's viewport (see the parent
     dashboard); body owns its own scroll so the form-builder modal,
     which is position:fixed, behaves against the iframe's actual
     viewport instead of an auto-resized full-content height. */
  body { margin:0; font:14.5px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--fg); background:transparent; }
  html, body { height:100%; }
  body { overflow-y:auto; overflow-x:hidden; }
  /* Wrap goes full width — caps were the source of "smushed" content
     when the iframe is wider than 980px. */
  .wrap { max-width:none; margin:0; padding:32px 32px 60px; }

  /* Page header — flat, no nested card. The page IS the surface. */
  .page-h {
    margin:0 0 32px;
  }
  .page-h h1 {
    font-size:28px; font-weight:600; color:var(--fg);
    margin:0 0 4px; line-height:1.2; letter-spacing:-0.01em;
  }
  .page-h p {
    margin:0; color:var(--sub); font-size:16px;
  }

  /* Channel cards.
     One card = one channel = one decision. Big emoji, short name,
     1-3 word subtitle, ONE status pill, ONE CTA. The whole card is
     the click target — the button is just a visible affordance. */
  .channels {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px; margin-bottom:36px;
  }
  .ch {
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:22px 18px 18px;
    cursor:pointer; position:relative;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column;
    min-height:200px;
    text-align:left;
  }
  .ch:hover {
    transform:translateY(-2px) scale(1.01);
    box-shadow:0 8px 22px rgba(20,40,80,.10);
    border-color:#cdd7e3;
  }
  .ch[aria-disabled="true"] {
    opacity:.5; cursor:not-allowed;
  }
  .ch[aria-disabled="true"]:hover {
    transform:none; box-shadow:none; border-color:var(--line);
  }
  /* Big emoji icon — no background tile, the emoji carries the
     channel's identity. */
  .ch .icon {
    font-size:40px; line-height:1; margin-bottom:14px;
  }
  .ch h3 {
    margin:0 0 2px; font-size:18px; font-weight:700;
    color:var(--fg); letter-spacing:-0.01em;
  }
  .ch .ch-sub {
    margin:0 0 14px; color:var(--sub);
    font-size:12.5px; line-height:1.35;
  }
  .ch .pill {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:99px; align-self:flex-start;
  }
  .ch .pill .dot {
    width:7px; height:7px; border-radius:99px; background:currentColor;
  }
  /* Single source of truth for state — set on .pill data-state. */
  .ch .pill[data-state="ready"]    { background:#e6f6ec; color:#0a8a3a; }
  .ch .pill[data-state="off"]      { background:#eef0f3; color:#5a6470; }
  .ch .pill[data-state="off"] .dot { background:#9aa4b2; }
  .ch .pill[data-state="soon"]     { background:#eef0f3; color:#5a6470; }
  .ch .pill[data-state="soon"] .dot{ background:#9aa4b2; }
  /* CTA — single, prominent, large enough to tap. */
  .ch .stat {
    font-size:11.5px; color:var(--sub);
    margin-top:auto; padding-top:10px;
  }
  .ch .cta {
    display:inline-flex; align-items:center; justify-content:center;
    margin-top:14px; align-self:stretch;
    background:var(--accent); color:#fff; border:0;
    padding:11px 14px; border-radius:10px;
    font:inherit; font-size:13.5px; font-weight:600;
    cursor:pointer; min-height:44px;
    transition:background .12s ease, transform .12s ease;
  }
  .ch .cta:hover { background:#0e4d8a; transform:translateY(-1px); }
  .ch .cta-secondary {
    background:#fff; color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .ch .cta-secondary:hover { background:#f0f6fb; }

  /* Forms section */
  .section-h {
    margin:8px 0 14px;
  }
  .section-h h2 {
    font-size:18px; font-weight:700; margin:0; color:var(--fg);
    letter-spacing:-0.01em;
  }
  /* Forms section sits directly on the page background — no nested
     card. Each form is its own card matching the channel-card pattern. */
  .forms-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .form-card {
    position:relative;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px 16px 14px;
    cursor:pointer; display:flex; flex-direction:column; gap:6px;
    min-height:140px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .form-card:hover {
    transform:translateY(-2px) scale(1.01);
    box-shadow:0 8px 22px rgba(20,40,80,.10);
    border-color:#cdd7e3;
  }
  .form-card:hover .form-card-del { opacity:1; }
  .form-card:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .form-card-head {
    display:flex; align-items:center; gap:10px;
  }
  .form-card-ico { font-size:22px; line-height:1; flex-shrink:0; }
  .form-card-title {
    font-size:15px; font-weight:700; color:var(--fg);
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .form-card-meta {
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    font-size:11.5px; color:var(--sub);
  }
  .form-card-meta .row-status { margin-left:0; }
  .form-card-flow {
    font-size:12px; color:var(--sub);
  }
  .form-card-flow strong { color:var(--fg); font-weight:600; }
  .form-card-flow-warn { color:#a86200; }
  .form-card-foot {
    margin-top:auto; padding-top:6px;
    font-size:11.5px; color:#9aa4b2;
  }
  .form-card-webhook-btn {
    align-self:flex-start;
    display:inline-flex; align-items:center; gap:6px;
    margin-top:6px;
    padding:5px 10px;
    border:1px solid #cbd5e1; border-radius:99px;
    background:#f8fafc; color:#185fa5;
    font:inherit; font-size:11.5px; font-weight:600;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .form-card-webhook-btn:hover {
    background:#eff6ff; border-color:#94a3b8;
  }
  /* Webhook modal — opens from the card link. Same backdrop pattern
     the rest of this page uses. */
  .wh-modal-bg {
    position:fixed; inset:0; background:rgba(15,23,42,.45);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:9999;
    animation:wh-fade .12s ease;
  }
  @keyframes wh-fade { from { opacity:0 } to { opacity:1 } }
  .wh-modal {
    background:#fff; border-radius:14px;
    width:100%; max-width:640px; max-height:calc(100vh - 48px);
    overflow:auto; box-shadow:0 20px 50px rgba(15,23,42,.25);
    padding:22px;
    box-sizing:border-box;
  }
  .wh-modal h3 { margin:0 0 4px; font-size:18px; }
  .wh-modal-sub { margin:0 0 16px; color:var(--sub); font-size:13px; }
  .wh-url-row {
    display:flex; gap:8px; align-items:stretch;
    background:#f1f5f9; border:1px solid #cbd5e1; border-radius:10px;
    padding:6px; margin-bottom:14px;
  }
  .wh-url-input {
    flex:1; min-width:0;
    border:0; background:transparent;
    padding:8px 10px;
    font:inherit; font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace;
    color:#0f172a;
  }
  .wh-url-input:focus { outline:none; }
  .wh-copy-btn {
    border:0; background:#185fa5; color:#fff;
    padding:8px 14px; border-radius:8px;
    font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; flex-shrink:0;
  }
  .wh-copy-btn:hover { background:#1d4ed8; }
  .wh-copy-btn.is-ok { background:#16a34a; }
  .wh-section-h {
    font-size:13px; font-weight:600;
    margin:14px 0 8px; color:#0f172a;
    text-transform:uppercase; letter-spacing:.04em;
  }
  /* Plain-English step headers + paragraphs. Bigger and friendlier
     than the all-caps section labels above — meant to read like a
     short note, not a spec. */
  .wh-step-h {
    font-size:14px; font-weight:700; color:#0f172a;
    margin:14px 0 8px;
  }
  .wh-step-h:first-of-type { margin-top:0; }
  .wh-step-p {
    margin:0 0 10px; line-height:1.55;
    font-size:13.5px; color:#1f2937;
  }
  .wh-step-p code {
    background:#f1f5f9; border:1px solid #e2e8f0; border-radius:4px;
    padding:1px 6px; font-size:12px;
  }
  .wh-list {
    list-style:none; padding:0; margin:0;
    border:1px solid var(--line); border-radius:8px;
    background:#fafbfd;
  }
  .wh-list li {
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    font-size:13.5px; color:#1f2937;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .wh-list li:last-child { border-bottom:0; }
  .wh-list-key {
    color:var(--sub); font-size:12px;
  }
  .wh-list-key code {
    background:transparent; padding:0; font-size:12px;
  }
  .wh-pill-req {
    display:inline-flex; align-items:center;
    background:#fef3c7; color:#92400e;
    border-radius:99px; padding:1px 8px;
    font-size:11px; font-weight:600;
  }
  .wh-details {
    margin:14px 0 0;
    border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; background:#fff;
  }
  .wh-details summary {
    cursor:pointer; font-size:13px; font-weight:600; color:#185fa5;
    list-style:none;
  }
  .wh-details summary::-webkit-details-marker { display:none; }
  .wh-details summary::before {
    content:"▸ "; color:#94a3b8; margin-right:4px;
  }
  .wh-details[open] summary::before { content:"▾ "; }
  .wh-fields {
    border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-size:13px; background:#fafbfd;
  }
  .wh-fields div { padding:3px 0; }
  .wh-fields code {
    background:#fff; border:1px solid #e5e7eb; border-radius:4px;
    padding:1px 6px; font-size:12px;
  }
  .wh-snippet {
    background:#0f172a; color:#e2e8f0;
    border-radius:8px; padding:14px;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px;
    line-height:1.55;
    overflow:auto; max-height:240px;
    white-space:pre; tab-size:2;
    margin:10px 0 0;
  }
  .wh-foot {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12.5px;
  }
  .wh-regen {
    background:transparent; border:0; color:#b91c1c; cursor:pointer;
    font:inherit; font-size:12.5px; padding:4px 8px;
    border-radius:6px;
  }
  .wh-regen:hover { background:#fef2f2; }
  .wh-close-btn {
    background:#0f172a; color:#fff; border:0; border-radius:8px;
    padding:8px 16px; font:inherit; font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .form-card-del {
    position:absolute; top:8px; right:8px;
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line); background:#fff;
    color:#9aa4b2; cursor:pointer; font-family:inherit;
    font-size:14px; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition:opacity .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
  }
  .form-card-del:hover {
    background:#fef2f2; color:#b91c1c; border-color:#fecaca;
  }
  .row { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; }
  .row:last-child { border-bottom:0; }
  .row .name { font-weight:600; }
  .row .url { color:var(--sub); font-size:12.5px; word-break:break-all; }
  .actions { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .btn { background:var(--card); border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer; font:inherit; font-size:13px; }
  .btn:hover { border-color:#bcc7d4; }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .btn-primary:hover { background:#0e4d8a; border-color:#0e4d8a; }
  .btn-ghost { background:transparent; border:0; color:var(--accent); font-weight:600; }
  /* Empty-state for forms list — plain prose, NOT a duplicate CTA.
     The Form channel card above is the single primary path; this
     line just points at it. */
  .forms-empty { padding:14px 0 0; color:var(--sub); }
  .forms-empty p { margin:0; font-size:14px; }
  .forms-empty strong { color:var(--fg); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 14px; border-radius:6px; opacity:0; transition:opacity .2s; z-index:10000; }
  .toast.show { opacity:1; }

  /* Form-row status badges */
  .row-status {
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; padding:3px 9px;
    border-radius:99px; margin-left:8px;
    vertical-align:middle;
  }
  .row-status .dot { width:6px; height:6px; border-radius:99px; background:currentColor; }
  .rs-active   { background:#e6f6ec; color:#0a8a3a; }
  .rs-no-flow  { background:#fef5e7; color:#a86200; }
  .rs-draft    { background:#eef0f3; color:#5a6470; }

  /* Field cards in the builder */
  .fld-card {
    background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:10px;
    display:flex; align-items:center; gap:10px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
  }
  .fld-card:hover { border-color:#bcc7d4; }
  .fld-card.is-dragging {
    opacity:.4;
  }
  .fld-card.is-drop-target {
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(24,95,165,.18);
  }
  .fld-handle {
    color:#9aa4b2; cursor:grab; user-select:none;
    font-size:14px; line-height:1;
    padding:4px 2px;
  }
  .fld-handle:active { cursor:grabbing; }
  .fld-icon {
    width:28px; height:28px; border-radius:8px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; line-height:1; background:#f0f4f9;
  }
  .fld-label {
    flex:1; font-size:14px; font-weight:500; color:var(--fg);
    cursor:text; padding:4px 6px; border-radius:5px;
    border:1px solid transparent; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .fld-label:hover { background:#f5f7fa; }
  .fld-label-input {
    flex:1; font:inherit; font-size:14px; font-weight:500;
    padding:4px 6px; border:1px solid var(--accent); border-radius:5px;
    outline:none; min-width:0;
  }
  .fld-req-pill {
    background:transparent; border:0; cursor:pointer; font:inherit;
    font-size:11.5px; font-weight:600; padding:3px 9px;
    border-radius:99px; flex:0 0 auto;
    display:inline-flex; align-items:center; gap:5px;
  }
  .fld-req-pill .dot { width:5px; height:5px; border-radius:99px; background:currentColor; }
  .fld-req-pill.is-req { background:#e6f6ec; color:#0a8a3a; }
  .fld-req-pill.is-opt { background:#eef0f3; color:#5a6470; }
  .fld-del {
    border:0; background:transparent; cursor:pointer; padding:4px 8px;
    color:#9aa4b2; font-size:18px; line-height:1;
    opacity:0; transition:opacity .12s;
  }
  .fld-card:hover .fld-del { opacity:1; }
  .fld-del:hover { color:var(--err); }

  /* Add-field dropdown menu */
  .add-fld-wrap { position:relative; margin-top:6px; }
  .add-fld-menu {
    position:absolute; top:calc(100% + 4px); left:0;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 20px rgba(20,40,80,.10);
    min-width:240px; padding:8px 0; z-index:50;
    max-height:60vh; overflow:auto;
  }
  .add-fld-section {
    font-size:11px; font-weight:700; color:#9aa4b2;
    text-transform:uppercase; letter-spacing:.04em;
    padding:6px 14px;
  }
  .add-fld-item {
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; cursor:pointer; font-size:13.5px;
  }
  .add-fld-item:hover { background:#f5f7fa; }
  .add-fld-divider { height:1px; background:var(--line); margin:6px 0; }

  /* Builder modal frame.
     Full-bleed: the card spans the viewport (minus a 24px gutter)
     instead of being capped at 980px, so the controls column has
     real breathing room and stops smushing field rows. The card
     is capped at viewport-height so the footer is always visible
     no matter how many fields the user adds. */
  .builder-bg {
    position:fixed; inset:0; background:rgba(10,15,25,.55);
    display:flex; align-items:stretch; justify-content:center;
    z-index:9000; padding:24px; overflow:hidden;
  }
  .builder-card {
    background:#fff; border-radius:16px;
    width:100%;
    /* Pull the modal back from full-bleed: 75% of the viewport
       (with a 1100px ceiling on giant monitors) so the card has
       comfortable gutters on each side without compressing the
       columns. */
    max-width:min(75vw, 1100px);
    display:flex; flex-direction:column;
    height:100%;
    max-height:none;
    overflow:hidden;
    box-shadow:0 24px 64px rgba(15,23,42,.22);
  }
  /* Below 1100px the 75vw cap kicks in fine, but on tablet-ish
     widths give the modal more of the screen so columns aren't
     forced too narrow. */
  @media (max-width: 1100px) {
    .builder-card { max-width: 92vw; }
  }
  .builder-head {
    display:flex; align-items:center; gap:12px;
    padding:20px 28px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .builder-head h2 {
    margin:0; font-size:22px; font-weight:700; color:var(--fg);
    letter-spacing:-0.01em;
  }
  /* Two-column body: controls get more room than preview at all
     widths so long field labels don't wrap and the field rows
     stay tappable. Preview is a clean white pane (no gray
     background card-on-card feel) with just a hairline divider. */
  .builder-body {
    display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr); gap:0;
    flex:1; min-height:0;
  }
  .builder-controls {
    padding:24px 28px; overflow:auto; min-height:0;
  }
  .builder-preview  {
    padding:24px 28px; background:#fafbfc; overflow:auto;
    border-left:1px solid var(--line); min-height:0;
  }
  .builder-foot {
    display:flex; gap:10px; justify-content:space-between; align-items:center;
    padding:16px 28px; border-top:1px solid var(--line);
    flex-shrink:0;
  }
  /* On narrow viewports drop to a single column so the controls
     don't crush. The preview moves below the controls. */
  @media (max-width: 880px) {
    .builder-body { grid-template-columns: 1fr; }
    .builder-preview { border-left:0; border-top:1px solid var(--line); }
  }
  .b-section-h {
    font-size:11px; font-weight:700; color:#9aa4b2;
    text-transform:uppercase; letter-spacing:.05em;
    margin:24px 0 10px;
  }
  .b-section-h:first-child { margin-top:0; }
  .b-input { width:100%; padding:10px 12px; border:1px solid var(--line);
              border-radius:8px; font:inherit; font-size:14px;
              background:#fff; }
  .b-input:focus { outline:none; border-color:var(--accent);
                    box-shadow:0 0 0 3px rgba(24,95,165,.12); }

  /* Grouped card — visually separates "what they see" copy fields
     (button text, thank-you note) from the fields/flow above. */
  .b-card {
    background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:16px;
    margin-top:18px;
  }
  .b-card-h {
    font-size:13px; font-weight:700; color:#0a0a0a;
    margin:0 0 10px;
  }
  .b-field { margin-bottom:14px; }
  .b-field:last-child { margin-bottom:0; }
  .b-field-label {
    display:block; font-size:12.5px; font-weight:600;
    color:#3b4a5a; margin-bottom:6px;
  }
  .b-field-help {
    font-size:11.5px; color:#9aa4b2;
    margin-top:5px; line-height:1.4;
  }

  /* Danger zone — the Delete form button gets its own clearly-marked
     section at the very bottom of the editor so it's never confused
     with neutral actions like Cancel/Save. */
  .b-danger {
    margin-top:24px; padding:14px 16px;
    background:#fff5f5; border:1px solid #f5d3d3;
    border-radius:12px;
    display:flex; align-items:center; gap:12px;
  }
  .b-danger-text { flex:1; min-width:0; }
  .b-danger-title {
    font-size:13px; font-weight:700; color:#9a3a3a;
    margin:0 0 2px;
  }
  .b-danger-sub {
    font-size:12px; color:#a86060;
    line-height:1.4;
  }
  .b-danger-btn {
    flex:0 0 auto;
    background:#fff; border:1px solid #d77;
    color:#9a3a3a; padding:7px 14px; border-radius:8px;
    font:inherit; font-weight:600; font-size:13px;
    cursor:pointer;
  }
  .b-danger-btn:hover { background:#fdecec; border-color:#c55; }

  /* Flow step rows — the "What happens" sequence in the builder. */
  .flow-step {
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .flow-step:last-child { border-bottom:0; }
  .flow-step-num {
    width:22px; height:22px; flex:0 0 auto;
    border-radius:99px; background:#f0f4f9;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:#5a6470;
  }
  .flow-step-icon {
    width:34px; height:34px; flex:0 0 auto;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1;
  }
  .flow-step-body { flex:1; min-width:0; }
  .flow-step-title { font-weight:600; font-size:14px; color:var(--fg); margin-bottom:2px; }
  .flow-step-sub { color:var(--sub); font-size:12.5px; line-height:1.4; }
  .flow-step-btn { font-size:12.5px; padding:5px 10px; flex:0 0 auto; text-decoration:none; color:inherit; }
  .flow-step-tag {
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:99px; flex:0 0 auto;
  }
  .tag-on { background:#e6f6ec; color:#0a8a3a; }

  /* Big "Add more steps" CTA button — sits below the two-step flow
     summary. Visually distinct so it's the obvious next action. */
  .add-steps-cta {
    width:100%; margin-top:12px; padding:14px 16px;
    background:linear-gradient(135deg,#eaf3fc 0%,#f0e8fb 100%);
    border:1.5px dashed #b6c8e0; border-radius:12px;
    cursor:pointer; font:inherit; color:var(--fg);
    display:flex; align-items:center; gap:14px;
    text-align:left;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .add-steps-cta:hover {
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(20,40,80,.10);
    border-color:var(--accent);
    background:linear-gradient(135deg,#dceefb 0%,#ebe0f6 100%);
  }
  .add-steps-cta .ascta-icon {
    width:38px; height:38px; flex:0 0 auto;
    border-radius:10px; background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; line-height:1;
    box-shadow:0 1px 3px rgba(20,40,80,.08);
  }
  .add-steps-cta .ascta-body { flex:1; min-width:0; }
  .add-steps-cta .ascta-title { display:block; font-weight:700; font-size:15px; color:var(--fg); margin-bottom:1px; }
  .add-steps-cta .ascta-sub   { display:block; font-size:12.5px; color:var(--sub); }
  .add-steps-cta .ascta-arrow { font-size:18px; color:var(--accent); flex:0 0 auto; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-h">
    <h1>Lead intake</h1>
    <p>Pick where your leads come from.</p>
  </div>

  <div class="channels">
    <div class="ch" data-tone="form" id="ch-form">
      <div class="icon" aria-hidden="true">📝</div>
      <h3>Form</h3>
      <p class="ch-sub">On your site</p>
      <span class="pill" id="ch-form-pill" data-state="off"><span class="dot"></span><span class="ch-pill-text">Set up</span></span>
      <button class="cta" id="ch-form-cta">+ Make form</button>
      <div class="stat" id="ch-form-meta"></div>
    </div>

    <div class="ch" data-tone="email" id="ch-email">
      <div class="icon" aria-hidden="true">📧</div>
      <h3>Email</h3>
      <p class="ch-sub">Catch every email</p>
      <span class="pill" id="ch-email-pill" data-state="off"><span class="dot"></span><span class="ch-pill-text">Not connected</span></span>
      <button class="cta" id="ch-email-cta">Connect</button>
      <div class="stat" id="ch-email-meta"></div>
    </div>

    <div class="ch" data-tone="phone" id="ch-phone">
      <div class="icon" aria-hidden="true">💬</div>
      <h3>Texts</h3>
      <p class="ch-sub">Reply by SMS</p>
      <span class="pill" id="ch-phone-pill" data-state="off"><span class="dot"></span><span class="ch-pill-text">Set up</span></span>
      <button class="cta" id="ch-phone-cta">Set up</button>
      <div class="stat" id="ch-phone-meta"></div>
    </div>

    <div class="ch" data-tone="dm" aria-disabled="true" id="ch-dm">
      <div class="icon" aria-hidden="true">📲</div>
      <h3>DMs</h3>
      <p class="ch-sub">Instagram &amp; Facebook</p>
      <span class="pill" data-state="soon"><span class="dot"></span><span class="ch-pill-text">Soon</span></span>
    </div>
  </div>

  <div class="section-h">
    <h2>Your forms</h2>
  </div>
  <div id="forms-empty" class="forms-empty" hidden>
    <p>No forms yet. Tap <strong>Form</strong> above to make one.</p>
  </div>
  <div id="forms-list" class="forms-grid" hidden></div>
</div>
<div class="toast" id="toast"></div>
<script>
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; }); }
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800); }
  function hostBase(){ return location.origin; }
  function copy(text){
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function(){ toast("Copied"); }); }
    else { var i = document.createElement("input"); i.value = text; document.body.appendChild(i); i.select();
      try { document.execCommand("copy"); toast("Copied"); } catch(_){}
      document.body.removeChild(i); }
  }
  // ONE pill per card. setPill writes both the data-state (drives
  // colour) and the visible label so the user only ever sees a
  // single, accurate status.
  //   state:
  //     "ready" — set up + working (green)
  //     "off"   — needs setup (gray)
  //     "soon"  — coming soon (gray, hourglass dot)
  function setPill(pillId, state, label){
    var p = $(pillId);
    if (!p) return;
    p.setAttribute("data-state", state);
    var t = p.querySelector(".ch-pill-text");
    if (t) t.textContent = label;
  }
  function loadForms(){
    fetch("/me/forms", { credentials:"same-origin" }).then(function(r){ return r.json(); }).then(function(d){
      var forms = (d && d.forms) || [];
      _formsCache = forms;
      var hasForms = forms.length > 0;
      // Form channel — single pill. "Ready" once at least one form
      // exists; "Set up" when there are zero forms.
      setPill("ch-form-pill", hasForms ? "ready" : "off",
              hasForms ? "Ready" : "Set up");
      var formCta = $("ch-form-cta");
      if (formCta) {
        formCta.textContent = hasForms ? "+ Make form" : "+ Make form";
        formCta.classList.remove("cta-secondary");
        formCta.onclick = function(ev){ ev.stopPropagation(); openBuilder(); };
      }
      // Whole-card click target — anywhere on the form card opens
      // the builder. Status pill / button are visible affordances on
      // top of the same action.
      var formCard = $("ch-form");
      if (formCard) formCard.onclick = function(){ openBuilder(); };
      // (top-create button removed — Form channel card is the only
      //  primary path to "make a new form"; no duplicate CTA.)
      var totalLeads = forms.reduce(function(a,f){ return a + (f.lead_count || 0); }, 0);
      $("ch-form-meta").textContent = hasForms
        ? (forms.length + " form" + (forms.length === 1 ? "" : "s")
           + " · " + totalLeads + " lead" + (totalLeads === 1 ? "" : "s"))
        : "";
      if (forms.length === 0) { $("forms-empty").hidden = false; $("forms-list").hidden = true; renderEmpty(); }
      else { $("forms-empty").hidden = true; $("forms-list").hidden = false; renderList(forms); }
    });
  }
  var CHANNELS = {};
  function loadChannels(){
    fetch("/me/intake/channels", { credentials:"same-origin" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        CHANNELS = (d && d.channels) || {};
        var em = CHANNELS.email || {};
        var ph = CHANNELS.phone || {};
        // Email — single pill, single CTA per state.
        setPill("ch-email-pill", em.ready ? "ready" : "off",
                em.ready ? "Connected" : "Not connected");
        var emCta = $("ch-email-cta");
        if (emCta) {
          emCta.textContent = em.ready ? "Manage" : "Connect";
          emCta.classList.toggle("cta-secondary", !!em.ready);
          emCta.onclick = function(ev){ ev.stopPropagation(); openEmailModal(em); };
        }
        $("ch-email-meta").textContent = em.ready
          ? (em.connected_email + " · " + (em.leads_30d || 0) + " lead" + (em.leads_30d === 1 ? "" : "s"))
          : "";
        $("ch-email").onclick = function(){ openEmailModal(em); };

        // Phone — single pill, single CTA per state.
        setPill("ch-phone-pill", ph.ready ? "ready" : "off",
                ph.ready ? "Ready" : "Set up");
        var phCta = $("ch-phone-cta");
        if (phCta) {
          phCta.textContent = ph.ready ? "Manage" : "Set up";
          phCta.classList.toggle("cta-secondary", !!ph.ready);
          phCta.onclick = function(ev){ ev.stopPropagation(); openPhoneModal(ph); };
        }
        $("ch-phone-meta").textContent = ph.ready
          ? ((ph.phone_number || "") + " · " + (ph.leads_30d || 0) + " lead" + (ph.leads_30d === 1 ? "" : "s"))
          : "";
        $("ch-phone").onclick = function(){ openPhoneModal(ph); };

        // DMs — coming soon. Click does nothing visible; show a brief
        // toast so the user knows it isn't broken.
        var dmCard = $("ch-dm");
        if (dmCard) dmCard.onclick = function(){ toast("We're working on it."); };
      })
      .catch(function(){
        $("ch-email-meta").textContent = "Status unavailable";
        $("ch-phone-meta").textContent = "Status unavailable";
      });
  }
  function openEmailModal(em){
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px";
    var body = em.ready
      ? '<div style="font-size:36px;text-align:center;margin-bottom:8px">✅</div>'
        + '<p style="text-align:center;margin:0 0 4px;font-size:16px"><strong>' + esc(em.connected_email) + '</strong></p>'
        + '<p style="text-align:center;color:var(--sub);margin:0">New emails turn into leads automatically.</p>'
      : '<div style="font-size:36px;text-align:center;margin-bottom:8px">📧</div>'
        + '<p style="text-align:center;margin:0 0 14px">Sign in with Gmail. We catch new emails as leads.</p>'
        + '<div style="text-align:center"><a class="btn btn-primary" target="_top" href="' + esc(em.connect_url || '/auth/google/start') + '">Sign in with Google</a></div>';
    bg.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;padding:24px">'
      + '<div style="display:flex;justify-content:flex-end;margin-bottom:-8px">'
      +   '<button data-x style="border:0;background:transparent;font-size:24px;cursor:pointer;color:#888;line-height:1">&times;</button>'
      + '</div>' + body + '</div>';
    document.body.appendChild(bg);
    var close = function(){ try { document.body.removeChild(bg); } catch(_){} };
    bg.querySelector("[data-x]").onclick = close;
    bg.addEventListener("click", function(e){ if (e.target === bg) close(); });
  }
  function openPhoneModal(ph){
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px";
    var body;
    if (!ph.ready) {
      body = '<div style="font-size:36px;text-align:center;margin-bottom:8px">📱</div>'
        + '<p style="text-align:center;margin:0">You need a phone number first.</p>'
        + '<p style="text-align:center;color:var(--sub);margin:6px 0 0;font-size:13px">Talk to your admin to get one.</p>';
    } else {
      var url = ph.webhook_url || (location.origin + "/twilio/sms");
      body = '<div style="font-size:36px;text-align:center;margin-bottom:8px">📱</div>'
        + '<p style="text-align:center;margin:0 0 4px;font-size:16px"><strong>' + esc(ph.phone_number) + '</strong></p>'
        + '<p style="text-align:center;color:var(--sub);margin:0 0 18px">Paste this link in Twilio so we get the texts:</p>'
        + '<div style="background:#f5f7fa;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:Menlo,monospace;font-size:12.5px;word-break:break-all;text-align:center">' + esc(url) + '</div>'
        + '<div style="text-align:center;margin-top:12px"><button class="btn btn-primary" data-cp>Copy link</button></div>'
        + '<details style="margin-top:18px"><summary style="cursor:pointer;color:var(--accent);font-size:13px;font-weight:600">How? Step by step</summary>'
        +   '<ol style="color:var(--sub);margin-top:10px;padding-left:20px;line-height:1.7;font-size:13px">'
        +     '<li>Open Twilio. Click your number.</li>'
        +     '<li>Find <strong>Messaging</strong>.</li>'
        +     '<li>In <em>A message comes in</em>, paste the link.</li>'
        +     '<li>Pick <strong>HTTP POST</strong>. Save.</li>'
        +     '<li>Text your number to test it.</li>'
        +   '</ol>'
        + '</details>';
    }
    bg.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:24px">'
      + '<div style="display:flex;justify-content:flex-end;margin-bottom:-8px">'
      +   '<button data-x style="border:0;background:transparent;font-size:24px;cursor:pointer;color:#888;line-height:1">&times;</button>'
      + '</div>' + body + '</div>';
    document.body.appendChild(bg);
    var close = function(){ try { document.body.removeChild(bg); } catch(_){} };
    bg.querySelector("[data-x]").onclick = close;
    var cp = bg.querySelector("[data-cp]");
    if (cp) cp.onclick = function(){ copy(ph.webhook_url || (location.origin + "/twilio/sms")); };
    bg.addEventListener("click", function(e){ if (e.target === bg) close(); });
  }
  // The empty state is plain prose now — no button to wire up.
  function renderEmpty(){ /* no-op */ }
  // Card grid for the forms list. Matches the channel-card / My Flows
  // visual pattern (emoji + name + meta + hover lift). Click anywhere
  // on the card opens the editor; the small × is a destructive escape
  // hatch with stopPropagation. No "+ New form" button at the bottom —
  // the Form channel card above is the single primary path.
  function renderList(forms){
    var el = $("forms-list");
    el.innerHTML = forms.map(function(f){
      var fields = (f.fields || []).length;
      var hasFlow = !!(f.attached_flow_id || (f.flow_id && f.flow_id !== ""));
      var badge = hasFlow
        ? '<span class="row-status rs-active"><span class="dot"></span>Active</span>'
        : '<span class="row-status rs-no-flow"><span class="dot"></span>No flow</span>';
      var flowName = f.attached_flow_name
        || (hasFlow ? "First Hello" : "");
      var flowLine = flowName
        ? '<div class="form-card-flow">Sends: <strong>' + esc(flowName) + '</strong></div>'
        : '<div class="form-card-flow form-card-flow-warn">⚠️ No flow attached</div>';
      var edited = f.last_used_at
        ? "Last used " + _shortAgo(f.last_used_at)
        : (f.created_at ? "New" : "");
      return '<div class="form-card" data-id="' + f.id + '" tabindex="0">'
        +   '<button class="form-card-del" data-act="del" aria-label="Delete this form" title="Delete form">×</button>'
        +   '<div class="form-card-head">'
        +     '<span class="form-card-ico" aria-hidden="true">📝</span>'
        +     '<div class="form-card-title">' + esc(f.name) + '</div>'
        +   '</div>'
        +   '<div class="form-card-meta">'
        +     badge
        +     '<span>' + fields + ' field' + (fields === 1 ? "" : "s") + '</span>'
        +     '<span>·</span>'
        +     '<span>' + (f.lead_count || 0) + ' lead' + (f.lead_count === 1 ? "" : "s") + '</span>'
        +   '</div>'
        +   flowLine
        +   '<button class="form-card-webhook-btn" data-act="webhook" type="button">'
        +     '🔗 <span>Get link</span>'
        +   '</button>'
        +   '<div class="form-card-foot">' + esc(edited) + '</div>'
        + '</div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".form-card"), function(card){
      var id = card.getAttribute("data-id");
      var f = forms.find(function(x){ return x.id === id; });
      card.addEventListener("click", function(){ openBuilder(f); });
      card.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openBuilder(f); }
      });
      var delBtn = card.querySelector(".form-card-del");
      if (delBtn) delBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        deleteForm(f);
      });
      var whBtn = card.querySelector('[data-act="webhook"]');
      if (whBtn) whBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        openWebhookModal(f);
      });
    });
  }

  // "Get the link" modal — plain-English explanation of how to wire
  // the form on the user's own website. Designed for a non-technical
  // owner: ONE big link, ONE example to copy. The HTML/JS/curl tabs
  // are gone; an optional "Show me the code" disclosure surfaces the
  // ready-to-paste form snippet for whoever is actually doing the
  // wiring (often the user's web designer, not the user).
  function openWebhookModal(f){
    var bg = document.createElement("div");
    bg.className = "wh-modal-bg";
    bg.innerHTML = ''
      + '<div class="wh-modal" role="dialog" aria-modal="true" aria-labelledby="wh-h">'
      +   '<h3 id="wh-h">Your link</h3>'
      +   '<p class="wh-modal-sub">Paste this into your form. Done.</p>'
      +   '<div class="wh-url-row">'
      +     '<input class="wh-url-input" data-wh="url" readonly value="Loading…" />'
      +     '<button class="wh-copy-btn" data-wh="copy" type="button">Copy</button>'
      +   '</div>'
      +   '<div data-wh="fields-wrap"></div>'
      +   '<details class="wh-details">'
      +     '<summary>For your web person</summary>'
      +     '<pre class="wh-snippet" data-wh="snippet">Loading…</pre>'
      +   '</details>'
      +   '<div class="wh-foot">'
      +     '<button class="wh-regen" data-wh="regen" type="button">🔄 New link</button>'
      +     '<button class="wh-close-btn" data-wh="close" type="button">Done</button>'
      +   '</div>'
      + '</div>';
    document.body.appendChild(bg);

    var state = { url: "", token: "", fields: f.fields || [] };
    var $$ = function(s){ return bg.querySelector(s); };
    var close = function(){ try { document.body.removeChild(bg); } catch(_){} };
    bg.addEventListener("click", function(e){ if (e.target === bg) close(); });
    $$("[data-wh='close']").onclick = close;

    var renderFields = function(){
      var w = $$("[data-wh='fields-wrap']");
      if (!w) return;
      if (!state.fields.length) {
        w.innerHTML = '';
        return;
      }
      // Field list — bare labels, optional "needed" pill on required
      // ones. The technical key still shows small for whoever wires
      // it up but it's quiet enough to ignore.
      w.innerHTML = '<div class="wh-step-h" style="margin-top:14px">Asks for:</div>'
        + '<ul class="wh-list">'
        + state.fields.map(function(fd){
            return '<li>'
              + '<strong>' + esc(fd.label || fd.key || "") + '</strong>'
              + (fd.required ? ' <span class="wh-pill-req">needed</span>' : '')
              + ' <span class="wh-list-key">(<code>' + esc(fd.key || "") + '</code>)</span>'
              + '</li>';
          }).join("")
        + '</ul>';
    };

    var renderSnippet = function(){
      var url = state.url || "your-link-here";
      var fields = state.fields;
      var pre = $$("[data-wh='snippet']");
      if (!pre) return;
      var inputs = fields.map(function(fd){
        var t = (fd.type === "email" ? "email"
              : fd.type === "phone"  ? "tel"
              : fd.type === "number" ? "number"
              : fd.type === "textarea" ? "textarea"
              : "text");
        if (t === "textarea") {
          return '  <textarea name="' + esc(fd.key) + '"'
            + (fd.required ? ' required' : '') + '></textarea>';
        }
        return '  <input name="' + esc(fd.key) + '" type="' + t + '"'
          + (fd.required ? ' required' : '') + ' />';
      }).join("\n") || '  <input name="email" type="email" required />';
      pre.textContent = '<form action="' + url + '" method="POST">\n'
        + inputs + '\n'
        + '  <button type="submit">Send</button>\n</form>';
    };

    $$("[data-wh='copy']").onclick = function(){
      if (!state.url) return;
      try {
        navigator.clipboard.writeText(state.url);
        var btn = $$("[data-wh='copy']");
        btn.textContent = "Copied ✓";
        btn.classList.add("is-ok");
        setTimeout(function(){
          btn.textContent = "Copy";
          btn.classList.remove("is-ok");
        }, 1400);
      } catch(_) {}
    };

    $$("[data-wh='regen']").onclick = function(){
      if (!confirm("Make a new link? The old one will stop working right away.")) return;
      var btn = $$("[data-wh='regen']");
      btn.disabled = true; btn.textContent = "Making one…";
      fetch("/me/forms/" + encodeURIComponent(f.id) + "/webhook/regenerate", {
        method:"POST", credentials:"same-origin",
      }).then(function(r){ return r.json(); })
        .then(function(d){
          btn.disabled = false; btn.textContent = "🔄 Get a new link";
          if (d && d.url) {
            state.url = d.url; state.token = d.token;
            $$("[data-wh='url']").value = d.url;
            renderSnippet();
          }
        })
        .catch(function(){
          btn.disabled = false; btn.textContent = "🔄 Get a new link";
          alert("Couldn't make a new link. Please try again.");
        });
    };

    // Pull the URL.
    fetch("/me/forms/" + encodeURIComponent(f.id) + "/webhook", {
      credentials: "same-origin",
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.url) {

  function _shortAgo(ts){
    var s = Math.max(0, Math.floor(Date.now()/1000) - (Number(ts) || 0));
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60) + "m ago";
    if (s < 86400) return Math.floor(s/3600) + "h ago";
    if (s < 30 * 86400) return Math.floor(s/86400) + "d ago";
    return new Date(Number(ts) * 1000).toLocaleDateString();
  }
  // Optimistic delete: yank the card from the DOM and the in-memory
  // forms list immediately so the UI feels instant. The actual GCS
  // delete fires in the background via POST {op:"delete"} (the C
  // proxy strips DELETE). On failure we re-render from the server
  // and surface a toast — the card reappears so the user knows it
  // wasn't actually removed.
  var _formsCache = null;
  function deleteForm(f){
    if (!confirm("Delete \"" + f.name + "\"?")) return;
    // 1. Remove the card from the DOM right now.
    var listEl = document.getElementById("forms-list");
    if (listEl) {
      var card = listEl.querySelector('.form-card[data-id="' + f.id + '"]');
      if (card) {
        card.style.transition = "opacity .15s ease, transform .15s ease";
        card.style.opacity = "0";
        card.style.transform = "scale(.94)";
        setTimeout(function(){ if (card.parentNode) card.parentNode.removeChild(card); }, 150);
      }
      // If that was the last form, swap to the empty state immediately.
      setTimeout(function(){
        if (!listEl.querySelector(".form-card")) {
          listEl.hidden = true;
          var empty = document.getElementById("forms-empty");
          if (empty) empty.hidden = false;
        }
      }, 160);
    }
    // 2. Drop it from the in-memory cache too so a re-render mid-flight
    //    doesn't bring the card back. _formsCache is set by loadForms
    //    on every successful list fetch.
    if (Array.isArray(_formsCache)) {
      _formsCache = _formsCache.filter(function(x){ return x.id !== f.id; });
    }
    toast("Deleted");
    // 3. Fire the actual delete in the background.
    fetch("/me/forms/" + encodeURIComponent(f.id), {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: "delete" }),
    })
      .then(function(r){
        if (!r.ok) throw new Error("delete_failed");
        // Refresh the list silently to reconcile with server truth
        // (e.g., if the form had related records that also got
        // cleaned up). User won't see flicker because the card is
        // already gone from the DOM.
        loadForms();
      })
      .catch(function(){
        // Reverse the optimistic removal: re-fetch and tell the user.
        toast("Couldn't delete that form. Try again.");
        loadForms();
      });
  }

    document.body.appendChild(bg);
    // Close-without-save semantics:
    //   - If state.is_draft is set, the form was created as a draft (the

    var closeModal = function(){
      try { document.body.removeChild(bg); } catch (_) {}

        // "What they see" card removed per user request — submit_text

      //
      // If the form is brand-new (no state.id yet), we save it as a

        // setting the came-from-form flag on this iframe's storage

            // the breadcrumb is fine on either window.

            localStorage.setItem("intake_return_form_ts", String(Date.now()));

            localStorage.removeItem("intake_return_form_id");
            localStorage.removeItem("intake_return_form_ts");
            topSess.removeItem("outreach_came_from_form");
            try { sessionStorage.removeItem("outreach_came_from_form"); } catch(_){}
          }
        } catch(_){}

        catch(_) { window.location.href = "/dashboard#outreach"; }
      }

        // form_id to address /me/forms/<id>/flow, so this is the

        // user pressed "Add more steps" instead of "Save," which

        });
      };

      // Save handler.
      $("b-save").onclick = saveForm;
    }

    }

    function renderPreview(){
      var p = $("b-preview");
      // Mirror the public hosted_form.html input styles so the preview
      // matches the rendered form pixel-for-pixel.
      var inStyle = "width:100%;padding:10px 12px;border:1px solid #e6e6ea;border-radius:8px;font-size:14px;background:#fff;color:#777";
      var fieldsHtml = state.fields.length === 0
        ? '<div style="color:#aaa;font-size:13px;text-align:center;padding:24px 12px;border:1px dashed var(--line);border-radius:8px">Fields you add show here.</div>'
        : state.fields.map(function(f){
            var input;
            if (f.type === "textarea") {
              input = '<textarea rows="3" style="' + inStyle + ';resize:vertical" disabled></textarea>';
            } else if (f.type === "select") {
              input = '<select style="' + inStyle + '" disabled>'
                + '<option>' + (f.options && f.options[0] ? esc(f.options[0]) : "Choose…") + '</option></select>';
            } else if (f.type === "date") {
              input = '<input type="date" style="' + inStyle + '" disabled/>';
            } else if (f.type === "number") {
              input = '<input type="number" style="' + inStyle + '" disabled/>';
            } else {
              input = '<input style="' + inStyle + '" disabled/>';
            }
            return '<div style="margin-bottom:14px"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">'
              + esc(f.label)
              + (f.required ? ' <span style="color:#c0392b">*</span>' : '')
              + '</label>' + input + '</div>';
          }).join("");
      p.innerHTML = ''
        + '<div style="font-size:11px;font-weight:700;color:#9aa4b2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Live preview</div>'
        + '<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(20,40,80,.04)">'
        +   (state.name ? '<h3 style="margin:0 0 4px;font-size:18px">' + esc(state.name) + '</h3>' : '')
        +   fieldsHtml
        +   '<button style="width:100%;padding:11px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px;margin-top:6px;cursor:not-allowed" title="This is a preview" disabled>' + esc(state.submit_text || "Submit") + '</button>'
        + '</div>'
        + (state.thank_you ?
            '<div style="margin-top:14px;padding:12px 14px;background:#fff;border:1px dashed var(--line);border-radius:10px">'
              + '<div style="font-size:11px;font-weight:700;color:#9aa4b2;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">After they submit</div>'
              + '<div style="font-size:13.5px;color:var(--fg);font-style:italic">' + esc(state.thank_you) + '</div>'
            + '</div>' : "");
    }

    function renderAll(){ renderControls(); renderPreview(); renderFlowSteps(); }

    // Render the actual per-form flow's steps in the
    // "What happens when someone fills it out" panel. Fetches the
    // flow from /me/forms/<state.id>/flow on each call and lists
    // every node (skipping the Input trigger — that's the form
    // submission itself, already implied). Without this, the
    // panel hardcoded a single "First Hello" row regardless of
    // how many steps the canvas actually has.
    function renderFlowSteps(){
      var host = document.getElementById("b-flow-steps");
      if (!host) return;
      // Only meaningful when the form has been saved (has an id) —
      // brand-new unsaved drafts can't have a per-form flow yet.
      if (!state.id) return;
      fetch("/me/forms/" + encodeURIComponent(state.id) + "/flow",
        { credentials: "same-origin" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          var flow = d && d.flow;
          var nodes = (flow && Array.isArray(flow.nodes)) ? flow.nodes : [];
          // Linearize using edges so the order matches the canvas.
          var byId = {};
          nodes.forEach(function(n){ byId[n.id] = n; });
          var incoming = {}, outgoing = {};
          (flow && flow.edges || []).forEach(function(e){
            incoming[e.target] = (incoming[e.target] || []).concat(e);
            outgoing[e.source] = (outgoing[e.source] || []).concat(e);
          });
          // Find the input/root: a node with no incoming edges.
          var roots = nodes.filter(function(n){ return !(incoming[n.id] || []).length; });
          var ordered = [];
          var visited = {};
          function walk(id){
            if (!id || visited[id]) return;
            visited[id] = true;
            var n = byId[id];
            if (n) ordered.push(n);
            var outs = outgoing[id] || [];
            outs.forEach(function(e){ walk(e.target); });
          }
          if (roots.length) {
            roots.forEach(function(r){ walk(r.id); });
          } else {
            // Fall back to insertion order if no clean root.
            ordered = nodes.slice();
          }
          // Skip the Input trigger row — submitting the form is the
          // implicit step 1 and rendering it adds no information.
          var steps = ordered.filter(function(n){
            var aid = n && n.data && n.data.activityId;
            return aid !== "input";
          });
          if (steps.length === 0) {
            host.innerHTML = ''
              + '<div class="flow-step">'
              +   '<div class="flow-step-icon" style="background:#fef5e7">⚠️</div>'
              +   '<div class="flow-step-body">'
              +     '<div class="flow-step-title">No steps yet</div>'
              +     '<div class="flow-step-sub">Tap <strong>Add more steps</strong> below to build your flow.</div>'
              +   '</div>'
              +   '<button class="btn flow-step-btn" id="b-change-flow" type="button">Change</button>'
              + '</div>';
            wireChangeFlow();
            return;
          }
          host.innerHTML = steps.map(function(n, i){
            var d = (n && n.data) || {};
            var icon = d.icon || "✨";
            var title = d.title || d.kind || "Step " + (i + 1);
            var sub = d.cardSub || d.description || "";
            var bg = d.kind === "trigger" ? "#e7f7ec"
                   : d.kind === "logic"   ? "#fef5e7"
                   :                         "#eaf3fc";
            return ''
              + '<div class="flow-step">'
              +   '<div class="flow-step-num">' + (i + 1) + '</div>'
              +   '<div class="flow-step-icon" style="background:' + bg + '">' + esc(icon) + '</div>'
              +   '<div class="flow-step-body">'
              +     '<div class="flow-step-title">' + esc(title) + '</div>'
              +     (sub ? '<div class="flow-step-sub">' + esc(sub) + '</div>' : '')
              +   '</div>'
              + '</div>';
          }).join("")
          // Append a footer row with the Change button so the user
          // still has access to the change-flow modal.
          + '<div class="flow-step" style="background:#fafbfc">'
          +   '<div class="flow-step-icon" style="background:transparent;font-size:14px">✨</div>'
          +   '<div class="flow-step-body">'
          +     '<div class="flow-step-title" style="font-size:13px">' + steps.length + ' step' + (steps.length === 1 ? "" : "s") + ' total</div>'
          +     '<div class="flow-step-sub">Tap <strong>Add more steps</strong> below to edit on the canvas.</div>'
          +   '</div>'
          +   '<button class="btn flow-step-btn" id="b-change-flow" type="button">Change</button>'
          + '</div>';
          wireChangeFlow();
        })
        .catch(function(){
          // Silent fail — leave the placeholder so we don't lie.
        });
    }
    // Re-attach the change-flow handler after renderFlowSteps replaces
    // the panel HTML (the old #b-change-flow button is destroyed).
    function wireChangeFlow(){
      var chFl = document.getElementById("b-change-flow");
      if (!chFl) return;
      chFl.onclick = function(){
        openChangeFlowModal(state, function(picked){
          state.attached_flow_id   = picked.id;
          state.attached_flow_name = picked.name;
          renderAll();
        });
      };
    }

    // Persist the current state. onSaved(form) fires on success; the
    // caller decides what UI follows (share screen, navigate to canvas,
    // etc.). When onSaved is omitted we run the legacy share-screen path.
    //
    // The choice of POST (create) vs. PUT (update) is driven by
    // state.id, NOT the closed-over `editing` flag. The auto-create
    // path populates state.id asynchronously after the modal opens,
    // so a manual Save firing AFTER auto-create completes must do a
    // PUT to update — otherwise we'd create duplicate forms.
    function saveFormAndThen(onSaved){
      var btn = $("b-save"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      var payload = {
        name: state.name, flow_id: state.flow_id,
        attached_flow_id:   state.attached_flow_id,
        attached_flow_name: state.attached_flow_name,
        fields: state.fields, submit_text: state.submit_text,
        thank_you: state.thank_you,
        is_draft: !!state.is_draft,
      };
      var url = state.id ? ("/me/forms/" + state.id) : "/me/forms";
      // Always POST. The C proxy at port 9030 has no put_to_local helper,
      // so PUT requests are dropped before reaching Flask. The Flask
      // me_forms_one route accepts POST as an alias for PUT.
      return fetch(url, {
        method: "POST", credentials:"same-origin",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload),
      }).then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
        .then(function(res){
          if (!res.body || !res.body.form) {
            toast("Save failed: " + ((res.body && res.body.error) || ("HTTP " + res.status)));
            if (btn) { btn.disabled = false; btn.textContent = editing ? "Save" : "Save form"; }
            return null;
          }
          // Update the in-modal state so subsequent edits (e.g. after
          // returning from the canvas) preserve the saved id.
          state.id = res.body.form.id;
          editing = true;
          if (onSaved) onSaved(res.body.form);
          loadForms();
          return res.body.form;
        }).catch(function(e){
          toast("Network error: " + e.message);
          if (btn) { btn.disabled = false; btn.textContent = editing ? "Save" : "Save form"; }
          return null;
        });
    }
    function saveForm(){
      // Explicit Save promotes the form out of draft status. Closing
      // the modal after this won't trigger the cleanup path.
      state.is_draft = false;
      saveFormAndThen(function(savedForm){
        // Just close the builder. No share-screen / flow-prompt popup
        // chain — owner asked for a quiet save. They can re-open the
        // form to edit it again or grab the share link from the form
        // list later.
        document.body.removeChild(bg);
        toast("Saved.");
      });
    }
    var _wasEditingBeforeSave = editing;

    renderAll();
  }

  function openDestinationsModal(){
    // Honest scope note: most destinations are "coming soon" placeholders
    // that show the user the mental model. Email teammate is the only
    // one that maps to existing infra (it already piggybacks on the
    // First Hello flow's owner-alert step). Wire the rest as separate
    // integrations later.
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:9050;padding:20px";
    var tile = function(icon, title, sub, status){
      var disabled = status === "soon";
      var pillStyle = disabled
        ? "background:#eef0f3;color:#5a6470"
        : "background:#e6f6ec;color:#0a8a3a";
      return '<div style="display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;'
        + (disabled ? "opacity:.65;" : "") + '">'
        +   '<span style="font-size:24px">' + icon + '</span>'
        +   '<div style="flex:1;min-width:0">'
        +     '<div style="font-weight:600;font-size:14px">' + esc(title) + '</div>'
        +     '<div style="color:var(--sub);font-size:12.5px">' + esc(sub) + '</div>'
        +   '</div>'
        +   '<span class="row-status" style="' + pillStyle + '">'
        +     (disabled ? "Coming soon" : "Available")
        +   '</span>'
        + '</div>';
    };
    bg.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px">'
      + '<div style="display:flex;align-items:center;margin-bottom:6px">'
      +   '<h3 style="margin:0;font-size:18px;font-weight:600;flex:1">Send a copy of every lead to…</h3>'
      +   '<button data-d-x style="border:0;background:transparent;cursor:pointer;font-size:22px;color:#9aa4b2;line-height:1">&times;</button>'
      + '</div>'
      + '<p style="color:var(--sub);font-size:13px;margin:0 0 14px">Your dashboard always gets a copy. Pick anywhere else you want it to land.</p>'
      + tile("📧", "Email a teammate",   "Forwards each lead to another email address.", "soon")
      + tile("📊", "Google Sheets",      "Add a new row for every lead.", "soon")
      + tile("🏢", "HubSpot or Salesforce", "Push leads as new contacts.", "soon")
      + tile("🔗", "Webhook",             "Send raw JSON to a URL you control.", "soon")
      + '<div style="text-align:center;margin-top:14px;color:var(--sub);font-size:12.5px">'
      +   'Coming soon. We\'re wiring these up. <br>'
      +   'Tap your account team to be a beta tester.'
      + '</div>'
      + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">'
      +   '<button class="btn" data-d-x>Close</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(bg);
    var close = function(){ try { document.body.removeChild(bg); } catch(_){} };
    Array.prototype.forEach.call(bg.querySelectorAll("[data-d-x]"), function(b){ b.onclick = close; });
    bg.addEventListener("click", function(e){ if (e.target === bg) close(); });
  }

  function openChangeFlowModal(state, onPick){
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:9050;padding:20px";
    bg.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:22px">'
      + '<div style="display:flex;align-items:center;margin-bottom:6px">'
      +   '<h3 style="margin:0;font-size:18px;font-weight:600;flex:1">Pick a flow for this form</h3>'
      +   '<button data-cf-x style="border:0;background:transparent;cursor:pointer;font-size:22px;color:#9aa4b2;line-height:1">&times;</button>'
      + '</div>'
      + '<div id="cf-list" style="margin-top:14px;color:var(--sub);font-size:13px;text-align:center;padding:18px 0">Loading flows…</div>'
      + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">'
      +   '<button class="btn" data-cf-x>Cancel</button>'
      +   '<button class="btn btn-primary" id="cf-save" disabled>Use this flow</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(bg);
    var close = function(){ try { document.body.removeChild(bg); } catch(_){} };
    Array.prototype.forEach.call(bg.querySelectorAll("[data-cf-x]"), function(b){ b.onclick = close; });
    bg.addEventListener("click", function(e){ if (e.target === bg) close(); });

    var picked = state.attached_flow_id;
    fetch("/me/flows", { credentials:"same-origin" })
      .then(function(r){ return r.ok ? r.json() : { flows: [] }; })
      .then(function(d){
        var flows = (d && d.flows) || [];
        var list = bg.querySelector("#cf-list");
        if (flows.length === 0) {
          list.innerHTML = '<div>No flows available yet.</div>';
          return;
        }
        list.style.padding = "0"; list.style.color = "inherit"; list.style.textAlign = "left";
        list.innerHTML = flows.map(function(f){
          var sel = (f.id === picked);
          return '<label style="display:flex;align-items:center;gap:12px;padding:12px;border:'
            + (sel ? '2px solid var(--accent);background:#f1f7fd' : '1px solid var(--line);background:#fff')
            + ';border-radius:10px;cursor:pointer;margin-bottom:8px">'
            + '<input type="radio" name="cf-pick" value="' + esc(f.id) + '"' + (sel ? ' checked' : '') + ' style="flex:0 0 auto"/>'
            + '<span style="font-size:22px">' + esc(f.icon || "✨") + '</span>'
            + '<span style="flex:1;min-width:0">'
            +   '<div style="font-weight:600;font-size:14px">' + esc(f.name) + '</div>'
            +   '<div style="color:var(--sub);font-size:12.5px">' + esc(f.description || "") + '</div>'
            + '</span>'
            + '</label>';
        }).join("");
        Array.prototype.forEach.call(list.querySelectorAll('input[name="cf-pick"]'), function(r){
          r.addEventListener("change", function(){
            picked = r.value;
            // Re-render selection state.
            list.querySelectorAll("label").forEach(function(lb){
              var rd = lb.querySelector('input[name="cf-pick"]');
              var sel = rd && rd.value === picked;
              lb.style.border = sel ? "2px solid var(--accent)" : "1px solid var(--line)";
              lb.style.background = sel ? "#f1f7fd" : "#fff";
            });
            $("cf-save").disabled = (picked === state.attached_flow_id);
          });
        });
        $("cf-save").onclick = function(){
          var chosen = flows.find(function(f){ return f.id === picked; });
          if (chosen) onPick({ id: chosen.id, name: chosen.name });
          close();
        };
      });
  }

  function showFlowPrompt(form, onContinue){
    // Post-save modal: confirms what happens next in plain words.
    // v1 has one flow ("welcome flow"); the "Pick a different one"
    // card links to /dashboard#outreach for the Flow Builder.
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px";
    bg.innerHTML = ''
      + '<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:26px">'
      +   '<div style="font-size:42px;text-align:center;margin-bottom:6px">🎉</div>'
      +   '<h2 style="margin:0 0 6px;text-align:center;font-size:22px">Done!</h2>'
      +   '<p style="margin:0 0 20px;text-align:center;color:var(--sub);font-size:14px">'
      +     'When someone fills it out, what next?'
      +   '</p>'
      +   '<div data-fp-card style="border:2px solid var(--accent);background:#f1f7fd;border-radius:12px;padding:16px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:14px">'
      +     '<div style="font-size:28px">💬</div>'
      +     '<div style="flex:1">'
      +       '<div style="font-weight:600;font-size:15px">Say hi back</div>'
      +       '<div style="color:var(--sub);font-size:12.5px;margin-top:2px">We text or email them. Right away.</div>'
      +     '</div>'
      +     '<div style="color:var(--accent);font-weight:600;font-size:12px">Pick this</div>'
      +   '</div>'
      +   '<a data-fp-customize href="/dashboard#outreach" target="_top" style="border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;text-decoration:none;color:inherit;cursor:pointer;display:flex;align-items:center;gap:14px">'
      +     '<div style="font-size:28px">🛠️</div>'
      +     '<div style="flex:1">'
      +       '<div style="font-weight:600;font-size:15px">I&rsquo;ll pick later</div>'
      +       '<div style="color:var(--sub);font-size:12.5px;margin-top:2px">Open Flow Builder.</div>'
      +     '</div>'
      +   '</a>'
      + '</div>';
    document.body.appendChild(bg);
    var done = function(){ try { document.body.removeChild(bg); } catch(_){} if (onContinue) onContinue(); };
    bg.querySelector("[data-fp-card]").onclick = done;
    // The "customize" anchor navigates naturally.
    bg.addEventListener("click", function(e){ if (e.target === bg) done(); });
  }

  function showShareScreen(form){
    var url = location.origin + "/f/" + form.slug;
    var bg = document.createElement("div");
    bg.style = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px";
    bg.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:24px">'
      + '<div style="font-size:36px;text-align:center;margin-bottom:6px">🔗</div>'
      + '<h2 style="margin:0 0 4px;text-align:center">Here\'s your link</h2>'
      + '<p style="text-align:center;color:var(--sub);margin:0 0 16px;font-size:13.5px">Share it. Text it. Put it on your site.</p>'
      + '<div style="background:#f5f7fa;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:Menlo,monospace;font-size:12.5px;word-break:break-all;text-align:center">' + esc(url) + '</div>'
      + '<div style="display:flex;gap:8px;margin-top:14px">'
      +   '<button class="btn btn-primary" id="ss-copy" style="flex:1">Copy</button>'
      +   '<button class="btn" id="ss-open" style="flex:1">Open</button>'
      +   '<button class="btn" id="ss-close" style="flex:1">Done</button>'
      + '</div>'
      + '<details style="margin-top:18px"><summary style="cursor:pointer;color:var(--accent);font-size:13px;font-weight:600">Put it on your website</summary>'
      +   '<p style="color:var(--sub);margin:10px 0 6px;font-size:13px">Send this to your web person:</p>'
      +   '<pre style="background:#f5f7fa;border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:11.5px">'
      +     esc('<iframe src="' + url + '" width="100%" height="600" style="border:0"></iframe>')
      +   '</pre>'
      + '</details>'
      + '</div>';
    document.body.appendChild(bg);
    bg.querySelector("#ss-copy").onclick  = function(){ copy(url); };
    bg.querySelector("#ss-open").onclick  = function(){ window.open("/f/" + form.slug, "_blank"); };
    bg.querySelector("#ss-close").onclick = function(){ document.body.removeChild(bg); };
  }
  loadForms();
  loadChannels();

  // Return-from-canvas: when the user clicks "Add more steps" we drop
  // a breadcrumb in localStorage, navigate to /dashboard#outreach, and
  // expect the user to come back to /dashboard#leadIntake. On return,
  // re-open the form builder for the form they were editing so they
  // never have to re-find their place.
  (function checkReturnFromCanvas(){
    try {
      var fid = localStorage.getItem("intake_return_form_id");
      var ts  = parseInt(localStorage.getItem("intake_return_form_ts") || "0", 10);
      if (!fid) return;
      // Don't re-open if breadcrumb is older than 30 minutes — stale.
      if (!ts || (Date.now() - ts) > 30*60*1000) {
        localStorage.removeItem("intake_return_form_id");
        localStorage.removeItem("intake_return_form_ts");
        return;
      }
      // Clear the breadcrumb immediately so a refresh doesn't re-trigger.
      localStorage.removeItem("intake_return_form_id");
      localStorage.removeItem("intake_return_form_ts");
      fetch("/me/forms/" + encodeURIComponent(fid), { credentials:"same-origin" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (d && d.form) {
            // Small toast first, then re-open the builder so the user
            // sees they're picking up where they left off.
            toast("Welcome back — picking up where you left off.");
            setTimeout(function(){ openBuilder(d.form); }, 250);
          }
        })
        .catch(function(){});
    } catch(_){}
  })();

  // (autosize removed — iframe is now full-viewport-height in the
  //  dashboard route section and scrolls internally.)
</script>
