<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Settings — Phone Number Assignment</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-2: #38bdf8;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 20px;
      --status-idle: #6b7280;
      --status-building: #b45309;
      --status-ready: #047857;
      --status-failed: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #f2f5fb 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .topbar a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
    .topbar a:hover { text-decoration: underline; }
    .topbar-title { font-size: 15px; font-weight: 700; color: var(--text); }

    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 22px 80px;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
      padding-top: 10px;
      padding-bottom: 10px;
      background: #fafbfd;
    }
    tbody tr:hover td { background: #fafbfd; }
    tbody tr:last-child td { border-bottom: none; }

    .phone-cell { font-family: "JetBrains Mono", "Menlo", monospace; font-weight: 600; font-size: 15px; }
    .url-cell { color: var(--muted); font-size: 14px; word-break: break-word; max-width: 280px; }
    .demo-cell a { color: var(--accent); text-decoration: none; font-size: 14px; word-break: break-word; }
    .demo-cell a:hover { text-decoration: underline; }
    .demo-cell .empty { color: var(--muted); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f1f5f9;
      color: var(--status-idle);
    }
    .status.idle { color: var(--status-idle); }
    .status.building { color: var(--status-building); background: #fef3c7; }
    .status.ready { color: var(--status-ready); background: #d1fae5; }
    .status.failed { color: var(--status-failed); background: #fee2e2; }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .status.building .dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .row-error {
      display: block;
      margin-top: 6px;
      color: var(--status-failed);
      font-size: 13px;
    }

    /* Routing summary cell + method pills (reused by routing modal) */
    .routing-cell { font-size: 13px; }
    .routing-summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .routing-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      line-height: 1.6;
    }
    .routing-tag-email { background: #dbeafe; color: #1d4ed8; }
    .routing-tag-sms   { background: #ede9fe; color: #6d28d9; }
    .routing-tag-voice_call { background: #d1fae5; color: #047857; }
    .routing-cell .empty { color: var(--muted); }
    .routing-methods {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .routing-method {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .routing-method input[type="radio"] { accent-color: var(--accent); }
    .routing-method.is-selected {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.08);
    }
    .modal input.invalid {
      border-color: var(--status-failed);
      background: #fef2f2;
    }
    .modal .helper.error { color: var(--status-failed); }
    .modal label[hidden] { display: none !important; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .btn.secondary { background: #ffffff; color: var(--text); border-color: var(--border); }
    .btn.secondary:hover { background: #f1f5f9; }
    .btn.danger { background: #fff; color: var(--status-failed); border-color: #fecaca; }
    .btn.danger:hover { background: #fef2f2; }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }
    .modal.is-open { display: flex; }
    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      width: min(520px, 92vw);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-size: 18px; font-weight: 700; }
    .modal-close {
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
    }
    .modal label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .modal input[type="url"], .modal input[type="text"], .modal input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: inherit;
    }
    .modal input:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
    .modal .helper {
      font-size: 13px;
      color: var(--muted);
    }
    .modal .field-error {
      font-size: 13px;
      color: var(--status-failed);
      display: none;
    }
    .modal .field-error.is-visible { display: block; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Toast */
    .toast-stack {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5000;
      pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      font-size: 14px;
      max-width: 360px;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }
    .toast.success { background: #047857; }
    .toast.error { background: #b91c1c; }

    /* Loading skeleton */
    .skeleton {
      display: inline-block;
      height: 14px;
      background: linear-gradient(90deg, #e5e7eb 0%, #f3f4f6 50%, #e5e7eb 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 720px) {
      th, td { padding: 10px 6px; font-size: 13px; }
      .url-cell { max-width: 160px; }
      .modal-card { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar" data-standalone>
    <div class="topbar-inner">
      <a href="/dashboard" aria-label="Back to dashboard">← Dashboard</a>
      <span class="topbar-title">Admin Settings</span>
      <a href="/auth/logout">Logout</a>
    </div>
  </header>
  <script>
    // Hide the standalone topbar + page-header when the page is loaded inside
    // the dashboard's flip-switch panel (iframe). Saves vertical space.
    if (window.self !== window.top) {
      const topbar = document.querySelector('[data-standalone]');
      if (topbar) topbar.style.display = 'none';
      const main = document.querySelector('main');
      if (main) { main.style.margin = '0'; main.style.padding = '0'; main.style.maxWidth = 'none'; }
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      document.body.style.minHeight = '0';
      const card = document.querySelector('main .card');
      if (card) { card.style.boxShadow = 'none'; card.style.border = 'none'; card.style.padding = '0'; card.style.background = 'transparent'; card.style.borderRadius = '0'; }

      // Tell the parent how tall we are so it can size the iframe → no inner scroll.
      let lastReported = 0;
      function reportHeight() {
        const h = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight
        );
        if (Math.abs(h - lastReported) < 2) return;
        lastReported = h;
        try {
          window.parent.postMessage({ type: "admin-phones:height", height: h }, "*");
        } catch (e) {}
      }
      window.addEventListener("load", reportHeight);
      window.addEventListener("resize", reportHeight);
      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(reportHeight);
        ro.observe(document.body);
      } else {
        setInterval(reportHeight, 600);
      }
      // Re-report shortly after each fetch/render in case fonts/layout shift.
      setTimeout(reportHeight, 50);
      setTimeout(reportHeight, 300);
      setTimeout(reportHeight, 1200);
    }
  </script>

  <main>
    <section class="card">
      <div class="table-wrap">
        <table id="phonesTable" aria-live="polite">
          <thead>
            <tr>
              <th scope="col">Phone Number</th>
              <th scope="col">Status</th>
              <th scope="col">Website</th>
              <th scope="col">Demo URL</th>
              <th scope="col">Routing</th>
              <th scope="col" aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody id="phonesBody">
            <tr><td colspan="6"><span class="skeleton" style="width:60%;"></span></td></tr>
            <tr><td colspan="6"><span class="skeleton" style="width:60%;"></span></td></tr>
            <tr><td colspan="6"><span class="skeleton" style="width:60%;"></span></td></tr>
            <tr><td colspan="6"><span class="skeleton" style="width:60%;"></span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Assign modal -->
  <div class="modal" id="assignModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="assignModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="assignModalTitle">Assign phone</h3>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">×</button>
      </div>
      <label>
        Website URL
        <input id="assignUrlInput" type="url" placeholder="https://example.com" inputmode="url" autocomplete="off" />
      </label>
      <label id="adminBindUserRow" hidden>
        Bind to user
        <select id="adminBindEmail">
          <option value="">(use website URL only)</option>
        </select>
      </label>
      <p class="helper">This will scrape the site, train a bot on its content, and assign this phone number to the resulting demo. The demo will show a "Call this number" CTA tied to the phone.</p>
      <p class="field-error" id="assignFieldError"></p>
      <div class="modal-actions">
        <button class="btn secondary" type="button" data-close-modal>Cancel</button>
        <button class="btn" type="button" id="assignRunBtn">Run</button>
      </div>
    </div>
  </div>

  <!-- Routing modal -->
  <div class="modal" id="routingModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="routingModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="routingModalTitle">Routing</h3>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">×</button>
      </div>
      <div class="routing-methods" role="radiogroup" aria-label="Routing method" id="routingMethods">
        <label class="routing-method"><input type="radio" name="routing-method" value="email" /> Email</label>
        <label class="routing-method" id="routingMethodSmsLabel"><input type="radio" name="routing-method" value="sms" /> SMS</label>
        <label class="routing-method"><input type="radio" name="routing-method" value="voice_call" /> Voice call</label>
      </div>
      <label>
        <span id="routingTargetLabel">Target</span>
        <input id="routingTargetInput" type="text" autocomplete="off" />
        <span class="helper" id="routingTargetHelper"></span>
      </label>
      <label id="routingReplyWrap" hidden>
        Reply-To (email only)
        <input id="routingReplyInput" type="email" autocomplete="off" />
        <span class="helper" id="routingReplyHelper"></span>
      </label>
      <label>
        Label
        <input id="routingLabelInput" type="text" autocomplete="off" maxlength="80" placeholder="e.g. Daniel (owner)" />
        <span class="helper">Used in the bot's announcement and the email greeting.</span>
      </label>
      <div class="modal-actions">
        <button class="btn secondary" type="button" id="routingTestBtn">Send Test</button>
        <button class="btn secondary" type="button" data-close-modal>Cancel</button>
        <button class="btn" type="button" id="routingSaveBtn" disabled>Save</button>
      </div>
    </div>
  </div>

  <!-- Confirm reassign modal -->
  <div class="modal" id="confirmModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="confirmModalTitle">Replace existing demo?</h3>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">×</button>
      </div>
      <p id="confirmModalBody" class="helper"></p>
      <div class="modal-actions">
        <button class="btn secondary" type="button" data-close-modal>Cancel</button>
        <button class="btn" type="button" id="confirmModalProceed">Continue</button>
      </div>
    </div>
  </div>

  <noscript>
    <div style="margin:24px;padding:16px;border-radius:12px;background:#fef3c7;color:#92400e;font-family:Inter,Arial,sans-serif;">
      JavaScript is required for the phone assignment console.
    </div>
  </noscript>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function () {
      "use strict";

      const PHONES_URL = "/admin/phones";
      const POLL_FAST_MS = 5000;
      const POLL_SLOW_MS = 15000;
      const POLL_BACKOFF_AFTER_MS = 120000;

      const tbody = document.getElementById("phonesBody");
      const assignModal = document.getElementById("assignModal");
      const assignUrlInput = document.getElementById("assignUrlInput");
      const assignFieldError = document.getElementById("assignFieldError");
      const assignRunBtn = document.getElementById("assignRunBtn");
      const confirmModal = document.getElementById("confirmModal");
      const confirmModalBody = document.getElementById("confirmModalBody");
      const confirmModalProceed = document.getElementById("confirmModalProceed");
      const routingModal = document.getElementById("routingModal");
      const routingTitle = document.getElementById("routingModalTitle");
      const routingTargetInput = document.getElementById("routingTargetInput");
      const routingTargetLabel = document.getElementById("routingTargetLabel");
      const routingTargetHelper = document.getElementById("routingTargetHelper");
      const routingReplyWrap = document.getElementById("routingReplyWrap");
      const routingReplyInput = document.getElementById("routingReplyInput");
      const routingReplyHelper = document.getElementById("routingReplyHelper");
      const routingLabelInput = document.getElementById("routingLabelInput");
      const routingSaveBtn = document.getElementById("routingSaveBtn");
      const routingTestBtn = document.getElementById("routingTestBtn");
      const toastStack = document.getElementById("toastStack");

      let activePhoneId = null;
      let activeMode = "assign"; // "assign" | "reassign"
      let pollTimer = null;
      let pollStartedAt = null;
      let pendingConfirmAction = null;
      let lastFocused = null;

      function showToast(message, kind) {
        // Cap the visible stack so repeated errors don't pile up.
        while (toastStack.children.length > 3) {
          toastStack.firstElementChild.remove();
        }
        const t = document.createElement("div");
        t.className = "toast" + (kind ? " " + kind : "");
        t.textContent = message;
        toastStack.appendChild(t);
        requestAnimationFrame(() => t.classList.add("is-visible"));
        setTimeout(() => {
          t.classList.remove("is-visible");
          setTimeout(() => t.remove(), 250);
        }, 3500);
      }

      function openModal(modalEl) {
        lastFocused = document.activeElement;
        modalEl.classList.add("is-open");
        modalEl.setAttribute("aria-hidden", "false");
        const firstInput = modalEl.querySelector("input, button");
        if (firstInput) setTimeout(() => firstInput.focus(), 30);
      }

      function closeModal(modalEl) {
        modalEl.classList.remove("is-open");
        modalEl.setAttribute("aria-hidden", "true");
        if (lastFocused && typeof lastFocused.focus === "function") {
          lastFocused.focus();
        }
      }

      document.querySelectorAll("[data-close-modal]").forEach((el) => {
        el.addEventListener("click", () => {
          closeModal(el.closest(".modal"));
        });
      });

      [assignModal, confirmModal, routingModal].forEach((m) => {
        m.addEventListener("click", (e) => {
          if (e.target === m) closeModal(m);
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (assignModal.classList.contains("is-open")) closeModal(assignModal);
          if (confirmModal.classList.contains("is-open")) closeModal(confirmModal);
          if (routingModal.classList.contains("is-open")) closeModal(routingModal);
        }
        if (e.key === "Tab") {
          // Trap focus within whichever modal is open.
          const openModalEl = [assignModal, confirmModal, routingModal].find((m) => m.classList.contains("is-open"));
          if (!openModalEl) return;
          const focusables = openModalEl.querySelectorAll(
            'a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
          );
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      function isValidHttpsUrl(value) {
        if (!value) return false;
        try {
          const u = new URL(value);
          return u.protocol === "http:" || u.protocol === "https:";
        } catch (e) {
          return false;
        }
      }

      function setFieldError(msg) {
        if (!msg) {
          assignFieldError.textContent = "";
          assignFieldError.classList.remove("is-visible");
          assignUrlInput.removeAttribute("aria-invalid");
          return;
        }
        assignFieldError.textContent = msg;
        assignFieldError.classList.add("is-visible");
        assignUrlInput.setAttribute("aria-invalid", "true");
      }

      function statusBadge(status) {
        const cls = ["idle", "building", "ready", "failed"].includes(status) ? status : "idle";
        const labels = {
          idle: "Idle",
          building: "Building",
          ready: "Ready",
          failed: "Failed",
        };
        return `<span class="status ${cls}"><span class="dot"></span>${labels[cls]}</span>`;
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function buildActions(phone) {
        const status = phone.build_status || "idle";
        const hasAssignment = !!(phone.assigned_account_id || phone.assigned_website_url || phone.demo_url);
        const buttons = [];
        if (status === "idle") {
          buttons.push(`<button class="btn" type="button" data-action="assign" data-phone="${phone.phone_id}">Assign Website</button>`);
        } else if (status === "building") {
          buttons.push(`<button class="btn danger" type="button" data-action="cancel" data-phone="${phone.phone_id}">Cancel</button>`);
        } else if (status === "ready") {
          buttons.push(`<button class="btn secondary" type="button" data-action="reassign" data-phone="${phone.phone_id}">Reassign</button>`);
          if (phone.demo_url) {
            buttons.push(`<a class="btn" href="${escapeHtml(phone.demo_url)}" target="_blank" rel="noopener noreferrer">Open</a>`);
          }
        } else if (status === "failed") {
          buttons.push(`<button class="btn" type="button" data-action="retry" data-phone="${phone.phone_id}">Retry</button>`);
        }
        buttons.push(`<button class="btn secondary" type="button" data-action="routing" data-phone="${phone.phone_id}">Routing</button>`);
        if (hasAssignment && status !== "building") {
          buttons.push(`<button class="btn danger" type="button" data-action="disconnect" data-phone="${phone.phone_id}">Disconnect</button>`);
        }
        return `<div class="row-actions">${buttons.join("")}</div>`;
      }

      function routingSummary(phone) {
        const r = phone.routing;
        if (!r || !r.method || !r.target) {
          return `<span class='empty'>— Not configured</span>`;
        }
        const tagText = r.method === "email" ? "Email"
                       : r.method === "sms" ? "SMS"
                       : "Call";
        return `<span class="routing-summary"><span class="routing-tag routing-tag-${r.method}">${tagText}</span>${escapeHtml(r.target)}</span>`;
      }

      function renderRow(phone) {
        const tr = document.createElement("tr");
        tr.dataset.phoneId = phone.phone_id;
        const websiteCell = phone.assigned_website_url
          ? escapeHtml(phone.assigned_website_url)
          : "<span class='empty'>—</span>";
        const demoCell = phone.demo_url
          ? `<a href="${escapeHtml(phone.demo_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(phone.demo_url)}</a>`
          : "<span class='empty'>—</span>";
        const errLine = phone.build_status === "failed" && phone.build_error
          ? `<span class="row-error">Error: ${escapeHtml(phone.build_error)}</span>`
          : "";
        tr.innerHTML = `
          <td class="phone-cell">${escapeHtml(phone.phone_display || phone.phone_number || "")}</td>
          <td>${statusBadge(phone.build_status)}</td>
          <td class="url-cell">${websiteCell}</td>
          <td class="demo-cell">${demoCell}</td>
          <td class="routing-cell">${routingSummary(phone)}</td>
          <td>${buildActions(phone)}${errLine}</td>
        `;
        return tr;
      }

      function isValidEmail(v) {
        return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) && v.length <= 254;
      }
      function isValidE164(v) {
        return /^\+[1-9]\d{6,14}$/.test(v);
      }

      function renderPhones(phones) {
        tbody.innerHTML = "";
        if (!phones || !phones.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="6" style="color:var(--muted); text-align:center; padding:30px;">No phone numbers configured.</td>`;
          tbody.appendChild(tr);
          return;
        }
        phones.forEach((p) => {
          tbody.appendChild(renderRow(p));
        });
      }

      function anyBuilding(phones) {
        return phones.some((p) => p.build_status === "building");
      }

      let currentPhones = [];

      async function fetchPhones() {
        const res = await fetch(PHONES_URL, {
          headers: { "Accept": "application/json" },
          credentials: "same-origin",
        });
        if (res.status === 401 || res.status === 403) {
          window.location.href = "/login";
          throw new Error("Not authorized");
        }
        if (!res.ok) {
          throw new Error("Failed to load phones (" + res.status + ")");
        }
        const body = await res.json();
        return body.phones || [];
      }

      async function refresh() {
        try {
          const phones = await fetchPhones();
          currentPhones = phones;
          renderPhones(phones);
          schedulePoll();
        } catch (err) {
          if (err.message !== "Not authorized") {
            showToast("Could not load phones: " + err.message, "error");
          }
        }
      }

      function schedulePoll() {
        if (pollTimer) {
          clearTimeout(pollTimer);
          pollTimer = null;
        }
        if (!anyBuilding(currentPhones)) {
          pollStartedAt = null;
          return;
        }
        if (!pollStartedAt) pollStartedAt = Date.now();
        const elapsed = Date.now() - pollStartedAt;
        const interval = elapsed > POLL_BACKOFF_AFTER_MS ? POLL_SLOW_MS : POLL_FAST_MS;
        pollTimer = setTimeout(refresh, interval);
      }

      // Action dispatch
      tbody.addEventListener("click", (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        const phoneId = target.dataset.phone;
        const phone = currentPhones.find((p) => p.phone_id === phoneId);
        if (!phone) return;
        if (action === "assign") {
          openAssignModal(phone, "assign");
        } else if (action === "reassign") {
          openConfirm(
            "Replace existing demo?",
            `This will retrain the bot on a new site and replace the existing demo${phone.demo_url ? " at " + phone.demo_url : ""}. Continue?`,
            () => openAssignModal(phone, "reassign"),
          );
        } else if (action === "retry") {
          retryBuild(phone);
        } else if (action === "cancel") {
          cancelBuild(phone);
        } else if (action === "routing") {
          openRoutingModal(phone);
        } else if (action === "disconnect") {
          const site = phone.assigned_website_url || phone.demo_url || "this demo";
          openConfirm(
            "Disconnect this number?",
            `This will permanently delete the knowledge base for ${site}, remove the demo URL, and unlink ${phone.phone_display || phone.phone_number}. The phone number itself stays — you can re-assign it later. Continue?`,
            () => disconnectPhone(phone),
          );
        }
      });

      async function disconnectPhone(phone) {
        try {
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(phone.phone_id) + "/disconnect", {
            method: "POST",
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
          });
          const body = await res.json().catch(() => ({}));
          if (res.status === 200) {
            showToast("Disconnected.", "success");
            refresh();
          } else {
            showToast(body.error || ("Disconnect failed (HTTP " + res.status + ")"), "error");
          }
        } catch (e) {
          showToast("Network error.", "error");
        }
      }

      function openRoutingModal(phone) {
        activePhoneId = phone.phone_id;
        const r = phone.routing || {};
        const method = r.method || "email";
        routingTitle.textContent = "Routing — " + (phone.phone_display || phone.phone_number || "");
        routingModal.querySelectorAll('input[name="routing-method"]').forEach((inp) => {
          inp.checked = inp.value === method;
        });
        routingTargetInput.value = r.target || "";
        routingReplyInput.value = r.reply_to || "";
        routingLabelInput.value = r.label || "";
        clearRoutingErrors();
        syncRoutingMethodUi();
        validateRoutingModal();
        openModal(routingModal);
      }

      function clearRoutingErrors() {
        routingTargetInput.classList.remove("invalid");
        routingReplyInput.classList.remove("invalid");
        routingTargetHelper.textContent = "";
        routingTargetHelper.classList.remove("error");
        routingReplyHelper.textContent = "";
        routingReplyHelper.classList.remove("error");
      }

      function currentRoutingMethod() {
        const sel = routingModal.querySelector('input[name="routing-method"]:checked');
        return sel ? sel.value : "";
      }

      function syncRoutingMethodUi() {
        const m = currentRoutingMethod();
        routingModal.querySelectorAll(".routing-method").forEach((el) => {
          const inp = el.querySelector("input");
          if (inp && inp.checked) el.classList.add("is-selected");
          else el.classList.remove("is-selected");
        });
        const isEmail = m === "email";
        routingReplyWrap.hidden = !isEmail;
        if (m === "email") {
          routingTargetLabel.textContent = "Email address";
        } else if (m === "sms" || m === "voice_call") {
          routingTargetLabel.textContent = "Phone number (E.164, e.g. +12245551234)";
        } else {
          routingTargetLabel.textContent = "Target";
        }
      }

      function validateRoutingModal() {
        clearRoutingErrors();
        const method = currentRoutingMethod();
        const target = (routingTargetInput.value || "").trim();
        const replyTo = (routingReplyInput.value || "").trim();
        let valid = true;
        if (!method) valid = false;
        if (method === "email") {
          if (!target) valid = false;
          else if (!isValidEmail(target)) {
            valid = false;
            routingTargetInput.classList.add("invalid");
            routingTargetHelper.textContent = "Enter a valid email address.";
            routingTargetHelper.classList.add("error");
          }
          if (replyTo && !isValidEmail(replyTo)) {
            valid = false;
            routingReplyInput.classList.add("invalid");
            routingReplyHelper.textContent = "Enter a valid email address (or leave blank).";
            routingReplyHelper.classList.add("error");
          }
        } else if (method === "sms" || method === "voice_call") {
          if (!target) valid = false;
          else if (!isValidE164(target)) {
            valid = false;
            routingTargetInput.classList.add("invalid");
            routingTargetHelper.textContent = "Phone must be in E.164 format (start with + and country code).";
            routingTargetHelper.classList.add("error");
          }
        }
        routingSaveBtn.disabled = !valid;
        return valid;
      }

      routingModal.querySelectorAll('input[name="routing-method"]').forEach((inp) => {
        inp.addEventListener("change", () => { syncRoutingMethodUi(); validateRoutingModal(); });
      });
      [routingTargetInput, routingReplyInput, routingLabelInput].forEach((el) => {
        el.addEventListener("input", validateRoutingModal);
      });

      routingSaveBtn.addEventListener("click", async () => {
        if (!validateRoutingModal() || !activePhoneId) return;
        const method = currentRoutingMethod();
        const body = {
          method,
          target: (routingTargetInput.value || "").trim(),
          label: (routingLabelInput.value || "").trim(),
        };
        const replyTo = (routingReplyInput.value || "").trim();
        if (method === "email" && replyTo) body.reply_to = replyTo;
        routingSaveBtn.disabled = true;
        try {
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(activePhoneId) + "/routing", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showToast("Routing saved.", "success");
            if (data && data.phone) {
              const idx = currentPhones.findIndex((p) => p.phone_id === activePhoneId);
              if (idx >= 0) {
                currentPhones[idx] = data.phone;
                renderPhones(currentPhones);
              }
            }
            closeModal(routingModal);
          } else if (data.fields) {
            if (data.fields.target) {
              routingTargetInput.classList.add("invalid");
              routingTargetHelper.textContent = data.fields.target;
              routingTargetHelper.classList.add("error");
            }
            if (data.fields.reply_to) {
              routingReplyInput.classList.add("invalid");
              routingReplyHelper.textContent = data.fields.reply_to;
              routingReplyHelper.classList.add("error");
            }
            showToast("Validation failed.", "error");
          } else {
            showToast(data.error || ("Save failed (HTTP " + res.status + ")"), "error");
          }
        } catch (e) {
          showToast("Network error.", "error");
        } finally {
          validateRoutingModal();
        }
      });

      routingTestBtn.addEventListener("click", async () => {
        if (!activePhoneId) return;
        routingTestBtn.disabled = true;
        try {
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(activePhoneId) + "/routing/test", {
            method: "POST",
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.success) {
            const labels = { email: "Test email sent", sms: "Test SMS sent", voice_call: "Test call placed" };
            showToast(labels[data.method] || "Test sent.", "success");
          } else {
            showToast((data && data.error) || ("Test failed (HTTP " + res.status + ")"), "error");
          }
        } catch (e) {
          showToast("Network error.", "error");
        } finally {
          routingTestBtn.disabled = false;
        }
      });

      function openAssignModal(phone, mode) {
        activePhoneId = phone.phone_id;
        activeMode = mode;
        document.getElementById("assignModalTitle").textContent =
          (mode === "reassign" ? "Reassign " : "Assign ") + (phone.phone_display || phone.phone_number);
        assignUrlInput.value = mode === "reassign" ? (phone.assigned_website_url || "") : "";
        setFieldError("");
        openModal(assignModal);
      }

      function openConfirm(title, body, onProceed) {
        document.getElementById("confirmModalTitle").textContent = title;
        confirmModalBody.textContent = body;
        pendingConfirmAction = onProceed;
        openModal(confirmModal);
      }

      confirmModalProceed.addEventListener("click", () => {
        const fn = pendingConfirmAction;
        pendingConfirmAction = null;
        closeModal(confirmModal);
        if (fn) fn();
      });

      assignUrlInput.addEventListener("input", () => setFieldError(""));

      async function setupAdminBindRowAndSmsGate() {
        try {
          const meRes = await fetch("/me", { credentials: "same-origin" });
          const me = await meRes.json();
          const row = document.getElementById("adminBindUserRow");
          const select = document.getElementById("adminBindEmail");
          if (me && me.is_admin && row && select) {
            row.removeAttribute("hidden");
            try {
              const usersRes = await fetch("/admin/users/list", { credentials: "same-origin" });
              if (usersRes.ok) {
                const data = await usersRes.json();
                (data.users || []).forEach((u) => {
                  const opt = document.createElement("option");
                  opt.value = u.email;
                  opt.textContent = u.first_name ? `${u.first_name} <${u.email}>` : u.email;
                  select.appendChild(opt);
                });
              }
            } catch (_) { /* silent */ }
          }
          if (me && !me.is_admin) {
            const smsLabel = document.getElementById("routingMethodSmsLabel");
            if (smsLabel) smsLabel.remove();
          }
        } catch (_) { /* silent */ }
      }
      setupAdminBindRowAndSmsGate();

      assignRunBtn.addEventListener("click", async () => {
        const url = (assignUrlInput.value || "").trim();
        if (!isValidHttpsUrl(url)) {
          setFieldError("Enter a valid http(s) URL.");
          return;
        }
        try {
          const u = new URL(url);
          const host = (u.hostname || "").toLowerCase();
          if (host === "localhost" || host === "0.0.0.0" || host.endsWith(".local")) {
            setFieldError("Localhost and .local hostnames are not allowed.");
            return;
          }
        } catch (e) {
          setFieldError("Enter a valid http(s) URL.");
          return;
        }
        assignRunBtn.disabled = true;
        try {
          const bindEl = document.getElementById("adminBindEmail");
          const bindEmail = bindEl ? (bindEl.value || "").trim() : "";
          const reqBody = { website_url: url };
          if (bindEmail) reqBody.bind_to_email = bindEmail;
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(activePhoneId) + "/assign", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(reqBody),
          });
          const body = await res.json().catch(() => ({}));
          if (res.status === 202) {
            showToast("Build started.", "success");
            closeModal(assignModal);
            refresh();
          } else if (res.status === 429) {
            setFieldError("Rate limit hit. Try again in " + (body.retry_after_seconds || "a while") + " seconds.");
          } else {
            setFieldError(body.error || ("Failed (HTTP " + res.status + ")"));
          }
        } catch (err) {
          setFieldError("Network error. Try again.");
        } finally {
          assignRunBtn.disabled = false;
        }
      });

      async function retryBuild(phone) {
        try {
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(phone.phone_id) + "/retry", {
            method: "POST",
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
          });
          const body = await res.json().catch(() => ({}));
          if (res.status === 202) {
            showToast("Retry started.", "success");
            refresh();
          } else if (res.status === 429) {
            showToast("Rate limit hit. Try again later.", "error");
          } else {
            showToast(body.error || ("Retry failed (HTTP " + res.status + ")"), "error");
          }
        } catch (e) {
          showToast("Network error.", "error");
        }
      }

      async function cancelBuild(phone) {
        try {
          const res = await fetch(PHONES_URL + "/" + encodeURIComponent(phone.phone_id) + "/cancel", {
            method: "POST",
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
          });
          if (res.status === 200) {
            showToast("Build cancelled.", "success");
            refresh();
          } else {
            const body = await res.json().catch(() => ({}));
            showToast(body.error || ("Cancel failed (HTTP " + res.status + ")"), "error");
          }
        } catch (e) {
          showToast("Network error.", "error");
        }
      }

      // Initial gate: confirm we're an admin. Server-side gate is the real
      // protection; this is just for a clean redirect and to avoid showing
      // a 403-laden page if the user is logged in as non-admin.
      // When embedded in an iframe (e.g. the dashboard's flip-switch panel)
      // we never navigate the parent window — let the host page decide.
      const isEmbedded = window.self !== window.top;

      async function gateThenLoad() {
        try {
          const res = await fetch("/me", { credentials: "same-origin" });
          if (!res.ok) {
            if (!isEmbedded) window.location.href = "/login";
            return;
          }
          const me = await res.json();
          if (!me.authenticated) {
            if (!isEmbedded) window.location.href = "/login";
            return;
          }
          if (!me.is_admin) {
            if (!isEmbedded) window.location.href = "/dashboard";
            return;
          }
          refresh();
        } catch (e) {
          if (!isEmbedded) window.location.href = "/login";
        }
      }

      gateThenLoad();
    })();
  </script>
</body>
</html>
