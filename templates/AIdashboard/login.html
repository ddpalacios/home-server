<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palacios AI Login</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-2: #38bdf8;
        --border: #e2e8f0;
        --shadow: 0 30px 70px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .login-shell {
        width: 100%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        background: var(--card);
        border: 0;
        border-radius: 0;
        overflow: hidden;
        box-shadow: none;
      }

      .login-visual {
        position: relative;
        background:
          radial-gradient(circle at 20% 20%, rgba(45, 212, 255, 0.35), transparent 45%),
          radial-gradient(circle at 80% 30%, rgba(99, 102, 241, 0.4), transparent 50%),
          linear-gradient(135deg, #050914 0%, #0b1b4d 40%, #1f4fd1 70%, #2dd4ff 100%);
        color: #ffffff;
        padding: 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        clip-path: polygon(0 0, 78% 0, 92% 50%, 78% 100%, 0 100%);
        animation: none;
      }

      .login-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
          repeating-linear-gradient(120deg, rgba(56, 189, 248, 0.08) 0 1px, transparent 1px 18px);
        background-size: 28px 28px, 100% 100%;
        opacity: 0.55;
      }

      .login-visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 18, 51, 0.45), rgba(7, 18, 51, 0) 60%),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 22px);
        animation: glowPulse 6s ease-in-out infinite;
      }

      .visual-content {
        position: relative;
        z-index: 1;
        max-width: 420px;
      }

      .visual-title {
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 18px;
      }

      .visual-subtitle {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
      }

      .visual-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }

      .visual-metrics {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 16px;
        backdrop-filter: blur(8px);
      }

      .metric-card h4 {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .metric-card p {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .login-panel {
        padding: 72px 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        animation: fadeIn 0.9s ease-out both;
      }

      .logo-mark {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #111827, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.5px;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.35);
      }

      .login-heading h2 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .login-heading p {
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }

      .google-button {
        width: 100%;
        border: 1px solid var(--border);
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        background: #ffffff;
        color: #0f172a;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .google-button:hover {
        transform: translateY(-1px);
        border-color: rgba(37, 99, 235, 0.35);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      }

      .google-button:active {
        transform: translateY(0);
      }

      .google-icon {
        width: 20px;
        height: 20px;
      }

      .login-note {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.6;
      }

      @keyframes angleReveal {
        0% {
          clip-path: polygon(0 0, 100% 0, 100% 50%, 100% 100%, 0 100%);
        }
        60% {
          clip-path: polygon(0 0, 90% 0, 98% 50%, 90% 100%, 0 100%);
        }
        100% {
          clip-path: polygon(0 0, 78% 0, 92% 50%, 78% 100%, 0 100%);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 980px) {
        .login-shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .login-visual {
          min-height: 260px;
          clip-path: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <section class="login-visual">
        <div class="visual-content"></div>
      </section>
      <section class="login-panel">
        <div class="login-heading">
          <h2>Sign in to your dashboard</h2>
          <p>
            Use your Google account to access your AI assistant settings and client insights.
          </p>
        </div>
        <button class="google-button" id="googleLogin" type="button">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.4 0 6.2 1.2 8.4 3.2l6.3-6.3C34.7 2.6 29.7 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.7 6c1.8-5.3 6.7-9.7 13.6-9.7z"/>
            <path fill="#34A853" d="M46.5 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.8c-.6 3.2-2.5 6-5.5 7.9l8.4 6.5c4.9-4.5 7.8-11.2 7.8-18.1z"/>
            <path fill="#4A90E2" d="M10.4 28.8c-1-3-1-6.2 0-9.2l-7.7-6c-3.3 6.6-3.3 14.5 0 21.2l7.7-6z"/>
            <path fill="#FBBC05" d="M24 48c6.5 0 11.9-2.2 15.9-5.9l-8.4-6.5c-2.3 1.6-5.2 2.6-7.5 2.6-6.9 0-12.7-4.4-14.6-10.4l-7.7 6C5.7 41.9 14.2 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
        <p class="login-note">
          By continuing, you agree to authenticate with Google. If your account exists, you will be redirected to the dashboard.
        </p>
      </section>
    </div>
    <script>
      const button = document.getElementById("googleLogin");
      if (button) {
        button.addEventListener("click", () => {
          window.location.href = "http://127.0.0.1:5000/auth/google";
        });
      }
    </script>
  </body>
</html>
