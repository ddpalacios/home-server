<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustGotALead</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --accent-2: #38bdf8;
        --border: #e2e8f0;
        --shadow: 0 30px 70px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .login-shell {
        width: 100%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        background: var(--card);
        border: 0;
        border-radius: 0;
        overflow: hidden;
        box-shadow: none;
      }

      .login-visual {
        position: relative;
        background:
          radial-gradient(circle at 18% 22%, rgba(125, 217, 255, 0.28), transparent 46%),
          radial-gradient(circle at 75% 28%, rgba(60, 120, 220, 0.18), transparent 52%),
          linear-gradient(135deg, #16264b 0%, #2b5fb9 45%, #4f8ed8 78%, #8fc9f2 100%);
        color: #ffffff;
        padding: 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        clip-path: polygon(0 0, 78% 0, 92% 50%, 78% 100%, 0 100%);
        animation: none;
      }

      .login-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
          repeating-linear-gradient(120deg, rgba(56, 189, 248, 0.08) 0 1px, transparent 1px 18px);
        background-size: 28px 28px, 100% 100%;
        opacity: 0.55;
      }

      .login-visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 18, 51, 0.45), rgba(7, 18, 51, 0) 60%),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 22px);
        animation: glowPulse 6s ease-in-out infinite;
      }

      .visual-content {
        position: relative;
        z-index: 1;
        max-width: 420px;
      }

      .visual-title {
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 18px;
      }

      .visual-subtitle {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
      }

      .visual-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }

      .visual-metrics {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 16px;
        backdrop-filter: blur(8px);
      }

      .metric-card h4 {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .metric-card p {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .login-panel {
        padding: 72px 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        animation: fadeIn 0.9s ease-out both;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        text-decoration: none;
        color: var(--text);
      }

      .logo-text {
        font-weight: 800;
        letter-spacing: 0.3px;
        font-size: 1.24rem;
        text-transform: none;
        background: linear-gradient(90deg, #0f1b3a, #1f4fd1, #3aa0ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 4px 10px rgba(15, 23, 42, 0.18);
      }

      .logo-text span:nth-child(1),
      .logo-text span:nth-child(2) {
        color: inherit;
        margin-left: 0;
      }

      .logo-mark {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: contain;
        background: transparent;
        transform: scale(1);
        transform-origin: center;
        box-shadow: none;
      }

      .login-heading h2 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .login-heading p {
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }

      .google-button {
        width: 100%;
        border: 1px solid var(--border);
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        background: #ffffff;
        color: #0f172a;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .google-button:hover {
        transform: translateY(-1px);
        border-color: rgba(37, 99, 235, 0.35);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      }

      .google-button:active {
        transform: translateY(0);
      }

      .google-icon {
        width: 20px;
        height: 20px;
      }

      .login-note {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .login-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        margin: 6px 0 0;
      }
      .login-divider::before,
      .login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .email-toggle {
        background: none;
        border: 0;
        color: var(--accent);
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 6px 0;
        text-align: center;
      }
      .email-toggle:hover { text-decoration: underline; }
      .email-form {
        display: none;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }
      .email-form.is-open { display: flex; }
      .email-form input[type="email"] {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.95rem;
        font-family: inherit;
      }
      .email-form button {
        border: 0;
        border-radius: 14px;
        padding: 13px 18px;
        font-size: 0.95rem;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .email-form button:disabled { opacity: 0.6; cursor: not-allowed; }
      .email-feedback { font-size: 0.85rem; min-height: 18px; }
      .email-feedback.error { color: #b91c1c; }
      .email-feedback.ok { color: #047857; line-height: 1.6; }

      @keyframes angleReveal {
        0% {
          clip-path: polygon(0 0, 100% 0, 100% 50%, 100% 100%, 0 100%);
        }
        60% {
          clip-path: polygon(0 0, 90% 0, 98% 50%, 90% 100%, 0 100%);
        }
        100% {
          clip-path: polygon(0 0, 78% 0, 92% 50%, 78% 100%, 0 100%);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 980px) {
        .login-shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .login-visual {
          min-height: 260px;
          clip-path: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <section class="login-visual">
        <div class="visual-content"></div>
      </section>
      <section class="login-panel">
        <div class="logo">
          <img class="logo-mark" src="/portfolio/images/justgotalead.png" alt="Just got a lead logo" />
          <span class="logo-text">Just<span>Got</span><span>ALead</span></span>
        </div>
        <div class="login-heading">
          <h2>Sign in to your dashboard</h2>
          <p>
            Use your Google account to access your AI assistant settings and client insights.
          </p>
        </div>
        <button class="google-button" id="googleLogin" type="button">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.4 0 6.2 1.2 8.4 3.2l6.3-6.3C34.7 2.6 29.7 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.7 6c1.8-5.3 6.7-9.7 13.6-9.7z"/>
            <path fill="#34A853" d="M46.5 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.8c-.6 3.2-2.5 6-5.5 7.9l8.4 6.5c4.9-4.5 7.8-11.2 7.8-18.1z"/>
            <path fill="#4A90E2" d="M10.4 28.8c-1-3-1-6.2 0-9.2l-7.7-6c-3.3 6.6-3.3 14.5 0 21.2l7.7-6z"/>
            <path fill="#FBBC05" d="M24 48c6.5 0 11.9-2.2 15.9-5.9l-8.4-6.5c-2.3 1.6-5.2 2.6-7.5 2.6-6.9 0-12.7-4.4-14.6-10.4l-7.7 6C5.7 41.9 14.2 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
        <div class="login-divider">or</div>
        <button type="button" class="email-toggle" id="emailToggle">Sign in with email instead</button>
        <form class="email-form" id="emailForm" autocomplete="off">
          <input type="email" id="emailInput" placeholder="you@example.com" required />
          <button type="submit" id="emailSubmit">Email me a sign-in link</button>
          <div class="email-feedback" id="emailFeedback"></div>
        </form>
        <p class="login-note">
          By continuing, you agree to authenticate with Google. If your account exists, you will be redirected to the dashboard.
        </p>
      </section>
    </div>
    <script>
      const googleBtn = document.getElementById("googleLogin");
      if (googleBtn) {
        googleBtn.addEventListener("click", () => {
          window.location.href = "/auth/google";
        });
      }

      const toggle = document.getElementById("emailToggle");
      const form = document.getElementById("emailForm");
      const submit = document.getElementById("emailSubmit");
      const feedback = document.getElementById("emailFeedback");
      const emailInput = document.getElementById("emailInput");

      if (toggle && form) {
        toggle.addEventListener("click", () => {
          form.classList.toggle("is-open");
          if (form.classList.contains("is-open")) emailInput.focus();
        });
      }

      function setFeedback(text, kind) {
        if (!feedback) return;
        feedback.textContent = text || "";
        feedback.className = "email-feedback" + (kind ? " " + kind : "");
      }

      const params = new URLSearchParams(window.location.search);
      const err = params.get("error");
      const errMessages = {
        invalid_link: "That link isn't valid. Request a new one below.",
        expired_link: "That link expired. Enter your email below to get a fresh one.",
        already_used: "That link was already used. Request a new one below.",
        unauthorized: "Your access was revoked. Contact the admin.",
      };
      if (err && errMessages[err] && form) {
        form.classList.add("is-open");
        setFeedback(errMessages[err], "error");
      }

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = (emailInput.value || "").trim();
          if (!email) return;
          submit.disabled = true;
          setFeedback("");
          try {
            const res = await fetch("/auth/email/request", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            if (res.status === 400) {
              setFeedback("Please enter a valid email address.", "error");
              submit.disabled = false;
              return;
            }
            setFeedback("Check your inbox — your sign-in link will arrive in a moment. It expires in 15 minutes.", "ok");
            emailInput.value = "";
          } catch (_) {
            setFeedback("Network error. Please try again.", "error");
            submit.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
