<!doctype html>
<title>Live Studio</title>
<style>
  * {
    box-sizing: border-box; 
  }
body, html {  overflow: hidden; }

  body {
    display: flex;
    min-height: 100vh;
    flex-direction: row;
    margin: 0;
  }
  .outer-col-1 {
    background: #e4effd;
    flex: 1;
  }

  .inner-col {
    flex: 6;
    outline: 1px solid black;
  }
    #visualizer {
        width: 100%; height: 100%;

}
  .create-btn {
  /* position: absolute;
  top: 20px;   
  right: 10px; 
  z-index: 2;  */
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

  .hide-btn {
  border: none;
  border-radius: 6px;
  padding: 4px 6px;
  cursor: pointer;
}
.chat-container {
  display: flex;
  flex-direction: column;
  height: 90vh;
}

.messages {
  flex: 1;       
  scrollbar-width: thin;    
  scroll-behavior: smooth;
  overflow-y: auto;     
  padding: 0.5em;
}

.chat-input {
  display: flex;
  gap: 0.5em;
  padding: 0.5em;
  border-top: 1px solid #ccc;
}

.chat-input input {
  flex: 1;  
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #aaa;
}

.chat-input button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background-color: green;
  color: white;
  cursor: pointer;
}
#send {
            font-size: 1rem;
            background-color: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

    button:hover {
            background-color: #3a3a7c;
        }

        button:active {
            transform: scale(0.98);
        }
        
        input:focus {
            border-color: #4a4a8d;
        }

 canvas, nav {
    padding: 1em;
  }
</style>
<body>
<nav class="outer-col-1" id="chatbox">
  <div id="chat" class="chat-container">  
    <h1>Live Chat</h1>
    <div id="messages" class="messages">
      <p style="color: red;"> > 'Daniel' has connected!</p>
    </div>
    
    <div class="chat-input">
      <input id="messagebox" placeholder="Type a message here..." />
      <button onclick="send_message()" id="send">Send</button>
    </div>
  </div>
</nav>
      <div class="inner-col">
            <canvas id="visualizer" ></canvas>
      </div>
</body>

<script src="/life-of-sounds/html_utilities.js" ></script>
<script src="/life-of-sounds/live_client.js"></script>
