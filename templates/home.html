<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            /* outline: 1px solid black; */
            padding: 30px;
			display: flex;
  			flex-wrap: wrap;
			margin-top: 20px;
					justify-content: center;
				align-items: center;
        }

        .flex-item {
            outline: 1px solid black;
            width: 500px;
            height: 400px;
            position: relative; 
        }


        @media (max-width: 800px) {
            .flex-container {
                flex-direction: column;
			
				
            }
        }

        a.fill-div {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            text-decoration: none;
            color: black;
            font-size: 20px;
            font-weight: bold;
            transition: opacity 0.3s ease;

        }

        .flex-item:hover a.fill-div {

            opacity: 0.2;
			 transform: scale(0.98);

        }

        .flex-item::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size:85px;
            font-weight: bold;
            color: rgb(36, 1, 119);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; 

        }

        .flex-item:hover::after {
            content: "Join" ;
            opacity: 1;

        }
    </style>

	<style>
		.session{
			display: flex;
		}
		#create_session{
			padding: 30px;
			font-size: 30px;

		 button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background-color: lightgreen;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #35be26;
        }

        button:active {
            transform: scale(0.90);
        }



	</style>

</head>

<script>
	var nameList = [
	'Time','Past','Future','Dev',

	'Fall','Jump','Cliff','Mountain','Rend','Red','Blue',
	'Green','Yellow','Gold','Demon','Demonic','Panda','Cat',

	'Fear','Light','Glow','Tread','Deep','Deeper','Deepest',
	'Mine','Your','Worst','Enemy','Hostile','Force','Video',
	'Game','Donkey','Mule','Colt','Cult','Cultist','Magnum',
	'Gun','Assault','Recon','Trap','Trapper','Redeem','Code',
	'Script','Writer','Near','Close','Open','Cube','Circle',
	'Geo','Genome','Germ','Spaz','Shot','Echo','Beta','Alpha',
	'Gamma','Omega','Seal','Squid','Money','Cash','Lord','King',
	'Duke','Rest','Fire','Flame','Morrow','Break','Breaker','Numb',
	'Ice','Cold','Rotten','Sick','Sickly','Janitor','Camel','Rooster',
	'Sand','Desert','Dessert','Hurdle','Racer','Eraser','Erase','Big',
	'Small','Short','Tall','Sith','Bounty','Hunter','Cracked','Broken',
	'Sad','Happy','Joy','Joyful','Crimson','Destiny','Deceit','Lies',
	'Lie','Honest','Destined','Bloxxer','Hawk','Eagle','Hawker','Walker',
	'Zombie','Sarge','Capt','Captain','Punch','One','Two','Uno','Slice',
	'Slash','Melt','Melted','Melting','Fell','Wolf','Hound',
	'Legacy','Sharp','Dead','Mew','Chuckle','Bubba','Bubble','Sandwich',
	'Smasher','Extreme','Multi','Universe','Ultimate','Death','Ready','Monkey',   'Elevator','Wrench','Grease','Head','Theme','Grand','Cool','Kid','Boy',
	'Girl','Vortex','Paradox'
	];

	function generate() {
		return nameList[Math.floor( Math.random() * nameList.length )] + " " + nameList[Math.floor( Math.random() * nameList.length )];
	};

	function getRandomLightColor() {
	const r = Math.floor(Math.random() * 56) + 200; // Red: 200-255
	const g = Math.floor(Math.random() * 56) + 200; // Green: 200-255
	const b = Math.floor(Math.random() * 56) + 200; // Blue: 200-255

	return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
	}

	function create_session_tile(sessionid, sessionName){
		var container = document.getElementById("sessions")
		var new_div = document.createElement("div")
		var new_a = document.createElement("a")
		var span = document.createElement("span")
		span.style.fontSize = "30px"
		span.textContent = sessionName
		span.textContent = sessionName
		new_div.style.backgroundColor =  "lightyellow"
		new_a.href = "#"
		new_a.className = "fill-div"
		new_div.className= "flex-item"
		new_a.addEventListener("click", function () {
				this.classList.toggle("selected");
				if (this.classList.contains("selected")) {
					new_a.href = "live_studio#session="+sessionid
				} 
			});
		new_a.appendChild(span)
		new_div.appendChild(new_a)
		container.appendChild(new_div);
	}
	
	function get_session_by_userId(userid){
			var request = new Request('life-of-sounds/live_studio/session?userId='+userid, {
								method: 'GET',
								headers: new Headers({
											'Accept': 'application/json'
										})
					});
			
			fetch(request)
				.then((response)=> response.json())
				.then((data)=> {
					console.log("SESSION",data)
					let messages = data['values'];
                	messages.forEach(element => {
					let sessionid =  element['sessionid'];
					let userid = element['userid']
					let sessionName = element['name']
					create_session_tile(sessionid, sessionName)
                });
					
				})
		}

    document.getElementById("create_session").onclick = function () {
            let sessionName = prompt("Session Name:", "The "+generate()+ " Session");
			let data = {
                        'name': sessionName
                        ,'userid': "admin"
                        ,'username':"admin"
                    }
			 var request = new Request('/life-of-sounds/live_studio/session', {
                            method: 'POST',
                            headers: new Headers({
                                        'Accept': 'application/json',
                                        'Content-Type': 'text/json'
                                    })
                            ,body: JSON.stringify(data)
                    });
			fetch(request).then(async(response) => {
                        if (response.ok) {
							 const data = await response.json();
							location.href = "live_studio#session="+data['sessionId']
                        }
                    }).catch(e => console.error('EXCEPTION: ', e))
    }

	    window.addEventListener("load", function() {
			userid = "admin"
			get_session_by_userId(userid)
    });




</script>
