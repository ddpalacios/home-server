        { id: "diy-vs-pro", h: "DIY vs. hire a pro",

          html: "<ul><li>Watering ordinance: odd/even days from May 15-September 15. Morning and evening only.</li><li>Winterization (blowing out the system) is required — usually mid-October to early November.</li><li>Crystal Lake requires a permit and licensed plumber for backflow preventer installation.</li><li>Spring start-up usually mid-April to early May.</li></ul>" },
        { id: "questions-to-ask", h: "Questions to ask before hiring",

      sources: "City of Crystal Lake watering ordinance; Illinois plumbing code Section 890.1140 (backflow prevention)",

    "seasonal-cleanup": {

        { id: "when-you-need-it", h: "When you need it",
          html: "<ul><li>Most homeowners hire seasonal cleanup at minimum, even if they handle weekly maintenance themselves</li><li>Especially valuable for older homeowners or homeowners who travel</li><li>Snow management contracts typically run November-March</li></ul>" },

  const ARTICLE_ORDER = [
    "lawn-care", "landscape-design", "hardscaping",
    "tree-shrub-care", "irrigation-drainage", "seasonal-cleanup",
  ];

  function shortDescription(slug) {
    return ({
      "lawn-care":           "Mowing, fertilization, aeration, weed control, seeding.",
      "landscape-design":    "Yard makeovers, planting beds, design plans, ornamentals.",
      "hardscaping":         "Patios, walkways, retaining walls, fire pits, outdoor kitchens.",
      "tree-shrub-care":     "Pruning, removal, disease and pest management, planting.",
      "irrigation-drainage": "Sprinkler systems, smart controllers, French drains, grading.",
      "seasonal-cleanup":    "Spring and fall cleanups, leaf removal, snow management.",
    })[slug] || "";
  }

  function setMeta(name, content) {
    let el = document.querySelector(`meta[name="${name}"]`);
    if (!el) { el = document.createElement("meta"); el.setAttribute("name", name); document.head.appendChild(el); }
    el.setAttribute("content", content);
  }
  function setOg(prop, content) {
    let el = document.querySelector(`meta[property="${prop}"]`);
    if (!el) { el = document.createElement("meta"); el.setAttribute("property", prop); document.head.appendChild(el); }
    el.setAttribute("content", content);
  }

  // ---------- Render: index page ----------
  function renderIndex() {
    document.title = "Landscaping services in Crystal Lake | McHenry County Landscapers";
    setMeta("description", "Plain-English guides for the six core landscaping services in Crystal Lake — what each one involves, what to look for in a pro, common mistakes, and DIY tips.");

    const cards = ARTICLE_ORDER.map((slug) => {
      const a = ARTICLES[slug];
      return `
        <a class="idx-card" href="/landscaping/services/${esc(slug)}">
          <div class="idx-card-icon" aria-hidden="true">${esc(a.icon)}</div>
          <h3>${esc(a.title)}</h3>
          <p>${esc(shortDescription(slug))}</p>
          <span class="idx-card-cta">Read the guide →</span>
        </a>`;
    }).join("");

    return `
      <div class="container">
        <div class="idx-hero">
          <h1>Landscaping services in Crystal Lake</h1>
          <p>Read about what each service involves, what to look for in a pro, and when to hire vs. handle it yourself. Plain English, regional specifics, no marketing fluff.</p>
        </div>
        <div class="idx-grid">${cards}</div>
      </div>`;
  }

  // ---------- Render: single article ----------
  function renderArticle(slug) {
    const a = ARTICLES[slug];
    if (!a) return renderNotFound();

    document.title = `${a.title} in Crystal Lake | McHenry County Landscapers`;
    setMeta("description", `${a.subtitle} What to look for, common mistakes, DIY vs. hire a pro, and questions to ask before booking.`);
    setOg("og:title",       `${a.title} in Crystal Lake`);
    setOg("og:description", a.subtitle);
    setOg("og:type",        "article");

    // Article schema for SEO
    const schemaScript = document.createElement("script");
    schemaScript.type = "application/ld+json";
    schemaScript.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": a.title + " in Crystal Lake",
      "description": a.subtitle,
      "datePublished": "2026-05-01",
      "dateModified":  "2026-05-08",
      "publisher": {
        "@type": "Organization",
        "name": "McHenry County Landscapers",
      },
    });
    document.head.appendChild(schemaScript);

    const toc = `
      <nav class="art-toc" aria-label="In this guide">
        <p class="art-toc-label">In this guide</p>
        <ul>
          ${a.sections.map((s) => `<li><a href="#${esc(s.id)}">${esc(s.h)}</a></li>`).join("")}
        </ul>
      </nav>`;

    const body = a.sections.map((s) =>
      `<section id="${esc(s.id)}"><h2>${esc(s.h)}</h2>${s.html}</section>`
    ).join("");

    const otherSlugs = ARTICLE_ORDER.filter((x) => x !== slug);
    const related = `
      <div class="art-related">
        <p class="art-related-label">Other landscaping services</p>
        <div class="art-related-pills">
          ${otherSlugs.map((s) => `<a class="art-related-pill" href="/landscaping/services/${esc(s)}">${esc(ARTICLES[s].icon)} ${esc(ARTICLES[s].title)}</a>`).join("")}
        </div>
      </div>`;

    const ctaQueries = {
      lawn_care:      "lawn care",
      design_install: "landscape design",
      hardscape:      "hardscaping",
      tree_shrub:     "tree work",
      irrigation:     "irrigation and drainage",
      seasonal:       "seasonal cleanup",
    };
    const ctaQuery = ctaQueries[a.match_category] || "landscaping";
    const cta = `
      <div class="art-cta">
        <h3>Ready to find a ${esc(a.title.toLowerCase())} pro?</h3>
        <p>We'll match you with up to three local pros in McHenry County. Free, no commitment.</p>
        <a class="art-cta-btn" href="/landscaping?q=${encodeURIComponent(ctaQuery)}">Get matched in 30 seconds →</a>
      </div>`;

    const sources = a.sources
      ? `<p class="art-sources"><strong>Sources:</strong> ${esc(a.sources)}</p>` : "";

    return `
      <div class="container container-narrow">
        <a class="art-back" href="/landscaping/services">← Back to services</a>
        <p class="art-breadcrumb"><a href="/landscaping">Home</a> / <a href="/landscaping/services">Services</a> / ${esc(a.title)}</p>

        <header class="art-header">
          <div class="art-icon" aria-hidden="true">${esc(a.icon)}</div>
          <h1>${esc(a.title)}</h1>
          <p class="art-subtitle">${esc(a.subtitle)}</p>
          <p class="art-meta">${esc(a.read_minutes)}-min read · Updated ${esc(a.last_updated)}</p>
        </header>

        ${toc}

        <article class="art-body">${body}</article>

        ${cta}
        ${related}
        ${sources}

        <div class="art-footer-spacer"></div>
      </div>`;
  }

  function renderNotFound() {
    return `
      <div class="container container-narrow" style="padding: 64px 24px; text-align: center;">
        <h1 style="font-family: 'Marcellus', serif; font-weight: 400; font-size: 32px;">Article not found</h1>
        <p>That guide doesn't exist. Try the <a href="/landscaping/services">services index</a>.</p>
      </div>`;
  }

  // ---------- Router ----------
  function route() {
    const main = document.getElementById("svcMain");
    const path = window.location.pathname.replace(/\/+$/, "");
    // Match /landscaping/services or /landscape/services (root)
    if (/^\/(landscaping|landscape)\/services$/.test(path)) {
      main.innerHTML = renderIndex();
      return;
    }
    // Match /landscaping/services/<slug>
    const m = path.match(/^\/(?:landscaping|landscape)\/services\/([a-z0-9-]+)$/);
    if (m) {
      main.innerHTML = renderArticle(m[1]);
      window.scrollTo(0, 0);
      return;
    }
    main.innerHTML = renderNotFound();
  }

  document.addEventListener("DOMContentLoaded", route);
})();
</script>
