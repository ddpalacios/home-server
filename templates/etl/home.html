<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/etl/home.css">
<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
	<link rel="stylesheet" href="/etl/jquery.flowchart.css">

	<script src="/etl/jquery.flowchart.js"></script>
	</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-header-row">
            <h3>Activities</h3>
            <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse activities panel">
              Hide
            </button>
        </div>
        <p class="sidebar-subtitle">Build your flow faster.</p>
        <div class="sidebar-search" role="search">
            <span class="sidebar-search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.6 4.6 1.4-1.4-4.6-4.6A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
            </span>
            <input id="activitySearch" type="search" placeholder="Search for an activity" aria-label="Search for an activity">
        </div>
    </div>
    <div class="sidebar-scroll">
    <div class="sidebar-buttons">
        <details class="activity-group" open>
            <summary>Ingest</summary>
            <div class="activity-group-content">
                <button id="import_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M7 9l5 5 5-5"/><path d="M5 20h14"/></svg>
                    </span>
                    Create Import
                </button>
                <button id="sheets_read_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h6"/></svg>
                    </span>
                    Google Sheets (Read)
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Prepare / Clean</summary>
            <div class="activity-group-content">
                <button id="clean_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
                    </span>
                    Trim/Clean
                </button>
                <button id="fill_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M6 12h12"/><path d="M9 17h6"/></svg>
                    </span>
                    Fill
                </button>
                <button id="dedupe_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/><path d="M4 4h10v10H4z"/></svg>
                    </span>
                    Dedupe
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Select / Shape</summary>
            <div class="activity-group-content">
                <button id="select_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M5 6h10M5 12h10M5 18h10"/><path d="M18 6l1.5 1.5L22 5"/></svg>
                    </span>
                    Select
                </button>
                <button id="split_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 6l8 8M4 18l8-8"/><path d="M14 6h6M14 18h6"/></svg>
                    </span>
                    Split Value
                </button>
                <button id="combine_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 7h6v4H4zM14 13h6v4h-6z"/><path d="M10 9l4 4"/></svg>
                    </span>
                    Combine Columns
                </button>
                <button id="cast_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M8 12h8"/><path d="M10 18h4"/></svg>
                    </span>
                    Type Cast
                </button>
                <button id="regex_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M7 12h10"/><path d="M9 17h6"/></svg>
                    </span>
                    Regex Extract
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Filter / Reduce</summary>
            <div class="activity-group-content">
                <button id="filter_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>
                    </span>
                    Create Filter
                </button>
                <button id="sort_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg>
                    </span>
                    Sort
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Aggregate / Summarize</summary>
            <div class="activity-group-content">
                <button id="aggregate_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 18h4M10 14h4M16 10h4"/></svg>
                    </span>
                    Create Aggregate
                </button>
                <button id="pivot_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M5 5h6v6H5z"/><path d="M13 5h6v6h-6z"/><path d="M5 13h6v6H5z"/></svg>
                    </span>
                    Pivot/Unpivot
                </button>
                <button id="window_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M6 12h12"/><path d="M8 18h8"/></svg>
                    </span>
                    Window/Rank
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Join / Merge</summary>
            <div class="activity-group-content">
                <button id="join_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 7h4v4H7zM13 13h4v4h-4z"/><path d="M11 9l2 2"/></svg>
                    </span>
                    Create Join
                </button>
                <button id="append_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    </span>
                    Append
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Custom / Advanced</summary>
            <div class="activity-group-content">
                <button id="custom_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 16l6-6 4 4 6-6"/></svg>
                    </span>
                    Create Custom
                </button>
                <button id="flatten_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h12"/><path d="M16 6l3 3-3 3"/></svg>
                    </span>
                    Flatten
                </button>
                <button id="replace_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 18h6l8-8-6-6-8 8z"/><path d="M14 6l4 4"/></svg>
                    </span>
                    Replace Value
                </button>
            </div>
        </details>
        <details class="activity-group" open>
            <summary>Sink</summary>
            <div class="activity-group-content">
                <button id="sheets_write_activity" class="create_operator buttons">
                    <span class="activity-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h6"/></svg>
                    </span>
                    Google Sheets (Write)
                </button>
            </div>
        </details>
    </div>
    </div>
</div>

<button id="sidebarToggleFloating" class="sidebar-toggle sidebar-toggle--floating" type="button" aria-label="Show activities panel">
  Activities
</button>

  <div class="content-wrapper">
    <div class="content">
      <div class="pipeline-run">
        <button id="run_pipeline" type="button" aria-label="Run pipeline">
          <svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg>
        </button>
      </div>
      	 <div id="chart_container">
				 <div class="drag-boundary-outline" aria-hidden="true"></div>
				
					<div class="flowchart-example-container" id="flowchartworkspace">

					</div>
	      </div> 
    </div>

    <div class="zoom-controls">
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button id="zoomReset" type="button" aria-label="Recenter view">⟳</button>
    </div>

    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">☀</span>
      Light
    </button>

    <div class="footer" id="footer" style="overflow-x: hidden; overflow-y: hidden;">
      <div class="resize-handle" id="resizeHandle"> <img src="/etl/images/drag.png" width="50" height="50"></div>
	  		<div class="navbar" style=" padding: 16px 20px; z-index: 1000; background: linear-gradient(135deg, #cfd7e2 0%, #bcc6d4 100%); border: 1px solid rgba(15, 23, 42, 0.08); width: 100%; display: flex; flex-direction: row; gap: 50px; transition: background 0.3s ease;">
				<div class="tab">
				<button class="tablinks" id="tabGeneral" onclick="switchTabPanel(event, 'tab_general')">General</button>
				<button class="tablinks" id="tabSettings" onclick="switchTabPanel(event, 'tab_settings')">Settings</button>
				<button class="tablinks" id="tabDataPreview" onclick="switchTabPanel(event, 'data_preview')">Data Preview</button>
				</div>
				

			</div>
			<div id="tab_general" class="tabcontent" style="display: flex; flex-direction: column; gap: 30px;">
				<div id="pipeline_properties" class="general-panel" style="display: flex; flex-direction: column; gap: 10px;">
					<label for="pipeline_title">Pipeline Name</label>
					<input id="pipeline_title" type="text" placeholder="Untitled pipeline">
					<label for="pipeline_description">Description</label>
					<textarea rows="5" cols="10" id="pipeline_description" type="text" placeholder="Describe the pipeline purpose"></textarea>
				</div>
				<div id="operator_properties" class="general-panel" style="display: flex; flex-direction: column; gap: 10px;">
					<label for="operator_title">Name</label>
					<input id="operator_title" type="text">
					<label for="operator_description">Description</label>
					<textarea rows="5" cols="10" id="operator_description" type="text" placeholder="Describe what this activity does"></textarea>
				</div>
				
			</div>
				<div id="tab_settings" class="tabcontent">
				<div id="link_properties" style="display: block;">
					<label for="link_color">Link's color: </label><input id="link_color" type="color"></div>
				<div id="selected_activity_settings" style="display: flex; flex-direction: column; gap: 10px;"></div>
				
			</div>
					<div id="data_preview" class="tabcontent">
						<div id="preview_button_stash" style="display: none;">
							<button id="refresh_preview" class="buttons" type="button">Refresh</button>
							<button id="export_preview" class="buttons" type="button">Export</button>
						</div>
						<div id="activity_previews"></div>
				</div>
    </div>
  </div>
  <script src="/websocket.js" defer></script>
  <script src="etl/activities.js" defer></script>
  <script src="etl/run.js" defer></script>
  <script src="etl/import.js" defer></script>
  <script src="etl/join.js" defer></script>
  <script src="etl/group.js" defer></script>
  <script src="etl/custom_column.js" defer></script>
  <script src="etl/split.js"defer></script>
  <script src="etl/combine.js" defer></script>
  <script src="etl/append.js" defer></script>
  <script src="etl/google_sheets.js" defer></script>
  <script src="etl/filter.js" defer></script>
  <script src="etl/replace.js" defer></script>
  <script src="etl/fill.js" defer></script>
  <script src="etl/clean.js" defer></script>
  <script src="etl/dedupe.js" defer></script>
  <script src="etl/cast.js" defer></script>
  <script src="etl/regex.js" defer></script>
  <script src="etl/pivot.js" defer></script>
  <script src="etl/window.js" defer></script>
  <script src="etl/select.js" defer></script>
  <script src="etl/sort.js" defer></script>
  <script src="etl/home-ui.js" defer></script>
  </body>
</html>
